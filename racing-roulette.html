<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Racing Roulette 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
canvas{display:block}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{font-family:inherit;outline:none;border:none}

#setupScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#15152a,#0a0a12 70%);z-index:100;padding:1.5rem}
.s-title{font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,#fff,#e10600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.2rem}
.s-sub{color:#666;font-size:.9rem;margin-bottom:1.8rem}
.s-form{display:flex;gap:.5rem;width:100%;max-width:460px;margin-bottom:1rem}
.s-form input{flex:1;padding:.7rem 1rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:1rem}
.s-form input:focus{border-color:#e10600}
.s-form input::placeholder{color:#555}
.s-form button{padding:.7rem 1.3rem;background:#e10600;color:#fff;border-radius:10px;font-weight:600;font-size:.95rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem;max-width:460px;justify-content:center}
.s-chip{display:flex;align-items:center;gap:.4rem;padding:.4rem .65rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;font-size:.82rem}
.s-dot{width:9px;height:9px;border-radius:50%}
.s-x{background:none;color:#666;font-size:1rem;padding:0;line-height:1}
.s-x:hover{color:#e10600}
.s-go{padding:1rem 3.5rem;background:linear-gradient(135deg,#e10600,#ff3333);color:#fff;border-radius:14px;font-size:1.2rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;transition:transform .15s,box-shadow .2s}
.s-go:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(225,6,0,.4)}
.s-go:disabled{opacity:.25;transform:none;box-shadow:none;cursor:not-allowed}

#hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;display:none}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;padding:.8rem 1.2rem}
.h-board{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.6rem .8rem;min-width:150px;border:1px solid rgba(255,255,255,.08)}
.h-bt{font-size:.6rem;color:#666;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.4rem;font-weight:700}
.h-row{display:flex;align-items:center;gap:.45rem;padding:.2rem 0;font-size:.75rem;font-weight:600}
.h-p{width:20px;font-weight:800;color:#666}
.h-p.g{color:#ffd700}.h-p.s{color:#c0c0c0}.h-p.b{color:#cd7f32}
.h-d{width:7px;height:7px;border-radius:50%}
.h-n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-cam{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.5rem .9rem;font-size:.65rem;color:#e10600;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border:1px solid rgba(225,6,0,.25);display:flex;align-items:center;gap:.45rem}
.h-rec{width:7px;height:7px;border-radius:50%;background:#e10600;animation:bk 1s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
#progWrap{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);z-index:20;display:none}
#progBar{height:100%;width:0;background:linear-gradient(90deg,#e10600,#ffcc00);transition:width .15s}
.h-lap{position:fixed;top:.8rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.5rem 1.2rem;font-size:.8rem;font-weight:700;z-index:20;display:none;border:1px solid rgba(255,255,255,.08);letter-spacing:.05em}

#commentary{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(225,6,0,.9),0 0 100px rgba(225,6,0,.3),0 4px 20px rgba(0,0,0,.8);z-index:30;pointer-events:none;white-space:nowrap;opacity:0;letter-spacing:.04em}
#commentary.show{animation:cpop .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(2.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}

#cdOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:40}
.cd-n{font-size:14rem;font-weight:900;color:#e10600;text-shadow:0 0 120px rgba(225,6,0,.7);animation:cdp .65s ease-out}
.cd-g{font-size:9rem;font-weight:900;color:#00dd44;text-shadow:0 0 120px rgba(0,221,68,.6);animation:cdp .45s ease-out}
@keyframes cdp{0%{transform:scale(3.5);opacity:0}35%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.85}}

#resultOverlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50}
.r-card{background:#141428;border:1px solid #2a2a4a;border-radius:24px;padding:2.5rem;text-align:center;max-width:400px;width:90%;animation:rpop .5s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.r-card::before{content:'';position:absolute;inset:-2px;border-radius:25px;background:linear-gradient(135deg,#e10600,transparent,#ffcc00);z-index:-1;opacity:.5}
@keyframes rpop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.r-t{font-size:3.5rem;margin-bottom:.4rem;animation:tb .6s ease-out .2s both}
@keyframes tb{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.r-l{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.15em;margin-bottom:.3rem}
.r-w{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#ffcc00,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem}
.r-list{text-align:left;margin-bottom:1.5rem}
.r-lt{font-size:.65rem;color:#666;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;font-weight:600}
.r-row{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;font-size:.85rem}
.r-row+.r-row{border-top:1px solid rgba(255,255,255,.05)}
.r-rp{font-weight:700;width:26px;text-align:center;font-size:.8rem}
.r-rp.gd{color:#ffd700}.r-rp.sv{color:#c0c0c0}.r-rp.bz{color:#cd7f32}
.r-rd{width:7px;height:7px;border-radius:50%}
.r-rn{flex:1}
.r-btn{padding:.8rem 2.5rem;background:linear-gradient(135deg,#e10600,#ff3333);color:#fff;border-radius:12px;font-size:1rem;font-weight:700;transition:transform .15s,box-shadow .2s}
.r-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(225,6,0,.4)}
.confetti-box{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.conf{position:absolute;top:-20px;animation:cfl linear forwards}
@keyframes cfl{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:35;transition:opacity .15s}

.s-rec{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem;padding:.7rem 1rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;max-width:460px;width:100%}
.s-rec-info{flex:1}
.s-rec-label{font-size:.88rem;color:#ccc;font-weight:600}
.s-rec-sub{font-size:.68rem;color:#666;margin-top:.1rem}
.s-toggle{position:relative;width:44px;height:24px;background:#333;border-radius:12px;cursor:pointer;transition:background .2s;flex-shrink:0}
.s-toggle.on{background:#e10600}
.s-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s}
.s-toggle.on::after{left:22px}
#recDot{position:fixed;top:.8rem;right:.8rem;display:none;align-items:center;gap:.4rem;padding:.35rem .7rem;background:rgba(225,6,0,.9);border-radius:8px;font-size:.7rem;font-weight:700;z-index:25;letter-spacing:.05em}
#recDot .rd-blink{width:8px;height:8px;border-radius:50%;background:#fff;animation:bk 1s infinite}

@media(max-width:600px){
  .s-title{font-size:1.7rem}#commentary{font-size:1.8rem}.cd-n{font-size:8rem}.cd-g{font-size:5rem}
  .h-board{min-width:110px;padding:.4rem .6rem}.h-row{font-size:.65rem}.r-card{padding:1.5rem}.r-w{font-size:1.5rem}
}
</style>
</head>
<body>
<div id="setupScreen"></div>
<div id="hud"><div class="h-top"><div class="h-board" id="hBoard"></div><div class="h-cam" id="hCam"><span class="h-rec"></span>WIDE</div></div></div>
<div id="progWrap"><div id="progBar"></div></div>
<div class="h-lap" id="lapDisp"></div>
<div id="commentary"></div>
<div id="cdOverlay"></div>
<div id="resultOverlay"></div>
<div id="flash"></div>
<div id="recDot"><span class="rd-blink"></span>REC</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ CONFIG ============ */
var COLORS=['#e10600','#0090ff','#ff8700','#00d2be','#2b4562','#27f4d2','#b6babd','#ff69b4','#52e252','#ffcc00','#ff5599','#6644ff'];
var CONF_C=['#e10600','#ffcc00','#0090ff','#00d2be','#ff8700','#fff','#52e252','#ff69b4'];
var C_OV=['OVERTAKE!','WHAT A MOVE!','INCREDIBLE!','UNBELIEVABLE!'];
var C_LD=['TAKES THE LEAD!','OUT IN FRONT!','LEADING THE PACK!'];
var C_FN=['FINAL STRETCH!','HERE WE GO!','ALMOST THERE!'];
var C_CL=['NECK AND NECK!','SO CLOSE!','SIDE BY SIDE!'];
var TRACK_W=14;

/* ============ CIRCUIT DEFINITION ============ */
var V=THREE.Vector3;
var circuitPts=[
  new V(-25,0,-55),new V(20,0,-57),         // Start/finish straight
  new V(48,0,-50),new V(62,0,-35),           // T1 entry
  new V(65,0,-12),                            // T1 apex
  new V(58,0,8),new V(65,0,22),              // T2 kink
  new V(55,0,40),new V(38,0,52),             // T3 sweeper
  new V(12,0,58),new V(-10,0,55),            // T4 hairpin entry
  new V(-28,0,42),                            // T4 apex
  new V(-40,0,30),new V(-55,0,18),           // T5 entry
  new V(-62,0,-2),                            // T5 apex
  new V(-58,0,-22),new V(-48,0,-38),         // T6
  new V(-38,0,-52)                            // T6 exit -> back to start
];

/* ============ STATE ============ */
var options=[],racers=[],phase='setup';
var animId=0,winnerId=null,finishCount=0,idCnt=0;
var cameraMode='wide',camTimer=null;
var lastLeaderId=null,overtakeCount=0;
var scene,camera,renderer,circuit;
var carMeshes={};
var camPos,camTarget,camGoalPos,camGoalTarget,camGoalFov;
var currentFov=60,camLerp=0.03,camTLerp=0.04;
var recordEnabled=false,mediaRecorder=null,recordedChunks=[];

function qs(s){return document.querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function hx(h){return parseInt(h.replace('#',''),16)}

/* ============ THREE.JS ============ */
function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x020210);
  scene.fog=new THREE.FogExp2(0x020210,0.004);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,600);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  camPos=new V(0,80,100);camTarget=new V(0,0,0);
  camGoalPos=new V(0,80,100);camGoalTarget=new V(0,0,0);camGoalFov=60;
  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
}

/* ============ TRACK MESH BUILDER ============ */
function buildRibbonGeo(curve,width,segs,yOff){
  var verts=[],idx=[],uvs=[];
  for(var i=0;i<=segs;i++){
    var t=i/segs;
    var p=curve.getPointAt(t);
    var tan=curve.getTangentAt(t);
    var right=new V().crossVectors(tan,new V(0,1,0)).normalize();
    var l=new V().copy(p).addScaledVector(right,-width/2);
    var r=new V().copy(p).addScaledVector(right,width/2);
    verts.push(l.x,yOff,l.z, r.x,yOff,r.z);
    uvs.push(0,t*width*2, 1,t*width*2);
    if(i<segs){var b=i*2;idx.push(b,b+2,b+1,b+1,b+2,b+3)}
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

/* ============ BUILD SCENE ============ */
function buildScene(){
  while(scene.children.length>0)scene.remove(scene.children[0]);
  carMeshes={};
  circuit=new THREE.CatmullRomCurve3(circuitPts,true,'catmullrom',0.5);

  // Lights (kept minimal for performance)
  scene.add(new THREE.AmbientLight(0x556688,0.9));
  var dir=new THREE.DirectionalLight(0xaaaadd,0.5);
  dir.position.set(50,80,-30);dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  dir.shadow.camera.left=-80;dir.shadow.camera.right=80;
  dir.shadow.camera.top=70;dir.shadow.camera.bottom=-70;
  scene.add(dir);

  // Ground
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshPhongMaterial({color:0x0a1a0a}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.1;ground.receiveShadow=true;
  scene.add(ground);

  // Track surface
  var trackGeo=buildRibbonGeo(circuit,TRACK_W,500,0.02);
  var trackMesh=new THREE.Mesh(trackGeo,new THREE.MeshPhongMaterial({color:0x222222,shininess:10}));
  trackMesh.receiveShadow=true;
  scene.add(trackMesh);

  // Kerbs (red/white)
  var kCanvas=document.createElement('canvas');kCanvas.width=64;kCanvas.height=16;
  var kctx=kCanvas.getContext('2d');
  for(var k=0;k<8;k++){kctx.fillStyle=k%2===0?'#e10600':'#fff';kctx.fillRect(k*8,0,8,16)}
  var kTex=new THREE.CanvasTexture(kCanvas);kTex.wrapS=kTex.wrapT=THREE.RepeatWrapping;
  for(var side=-1;side<=1;side+=2){
    var kGeo=buildRibbonGeo(circuit,1.2,500,0.03);
    // Offset kerb to edge
    var kPos=kGeo.attributes.position.array;
    for(var ki=0;ki<=500;ki++){
      var t=ki/500;
      var tan=circuit.getTangentAt(t);
      var right=new V().crossVectors(tan,new V(0,1,0)).normalize();
      var off=right.clone().multiplyScalar(side*(TRACK_W/2+0.6));
      kPos[ki*6]+=off.x;kPos[ki*6+2]+=off.z;
      kPos[ki*6+3]+=off.x;kPos[ki*6+5]+=off.z;
    }
    kGeo.attributes.position.needsUpdate=true;kGeo.computeVertexNormals();
    scene.add(new THREE.Mesh(kGeo,new THREE.MeshBasicMaterial({map:kTex})));
  }

  // Barriers
  var bMat=new THREE.MeshPhongMaterial({color:0x444455});
  for(var bi=0;bi<50;bi++){
    var bt=bi/50;
    var bp=circuit.getPointAt(bt);
    var btan=circuit.getTangentAt(bt);
    var bright=new V().crossVectors(btan,new V(0,1,0)).normalize();
    for(var bs=-1;bs<=1;bs+=2){
      var bm=new THREE.Mesh(new THREE.BoxGeometry(4,1.2,0.4),bMat);
      var boff=bright.clone().multiplyScalar(bs*(TRACK_W/2+2));
      bm.position.set(bp.x+boff.x,0.6,bp.z+boff.z);
      bm.rotation.y=Math.atan2(-btan.z,btan.x);
      scene.add(bm);
    }
  }

  // Lane center dashes
  var dMat=new THREE.MeshBasicMaterial({color:0x555555});
  for(var di=0;di<120;di++){
    var dt=di/120;
    var dp=circuit.getPointAt(dt);
    var dtan=circuit.getTangentAt(dt);
    var dm=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.08),dMat);
    dm.rotation.x=-Math.PI/2;dm.position.set(dp.x,0.04,dp.z);
    dm.rotation.z=-Math.atan2(-dtan.z,dtan.x);
    scene.add(dm);
  }

  // Finish line (checkered)
  var fC=document.createElement('canvas');fC.width=64;fC.height=64;
  var fctx=fC.getContext('2d');
  for(var fi=0;fi<8;fi++)for(var fj=0;fj<8;fj++){fctx.fillStyle=(fi+fj)%2===0?'#fff':'#111';fctx.fillRect(fi*8,fj*8,8,8)}
  var fTex=new THREE.CanvasTexture(fC);fTex.wrapS=fTex.wrapT=THREE.RepeatWrapping;fTex.repeat.set(1,3);
  var fp=circuit.getPointAt(0);
  var ftan=circuit.getTangentAt(0);
  var fright=new V().crossVectors(ftan,new V(0,1,0)).normalize();
  var fMesh=new THREE.Mesh(new THREE.PlaneGeometry(2,TRACK_W),new THREE.MeshBasicMaterial({map:fTex}));
  fMesh.rotation.x=-Math.PI/2;
  fMesh.position.set(fp.x,0.05,fp.z);
  fMesh.rotation.z=-Math.atan2(-ftan.z,ftan.x);
  scene.add(fMesh);

  // Start/Finish gantry
  var gMat=new THREE.MeshPhongMaterial({color:0x888888});
  var gLeft=new V().copy(fp).addScaledVector(fright,-TRACK_W/2-2);
  var gRight=new V().copy(fp).addScaledVector(fright,TRACK_W/2+2);
  var pole1=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,10,6),gMat);
  pole1.position.set(gLeft.x,5,gLeft.z);scene.add(pole1);
  var pole2=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,10,6),gMat);
  pole2.position.set(gRight.x,5,gRight.z);scene.add(pole2);
  var crossbar=new THREE.Mesh(new THREE.BoxGeometry(TRACK_W+4,0.4,1),gMat);
  crossbar.position.set(fp.x,10,fp.z);
  crossbar.rotation.y=Math.atan2(-ftan.z,ftan.x)+Math.PI/2;
  scene.add(crossbar);

  // Track lights along circuit (visual poles + few actual lights)
  var poleMat=new THREE.MeshPhongMaterial({color:0x555555});
  var bulbMat=new THREE.MeshBasicMaterial({color:0xffeedd});
  for(var li=0;li<16;li++){
    var lt=li/16;
    var lp=circuit.getPointAt(lt);
    var ltan=circuit.getTangentAt(lt);
    var lright=new V().crossVectors(ltan,new V(0,1,0)).normalize();
    for(var ls=-1;ls<=1;ls+=2){
      var lo=lright.clone().multiplyScalar(ls*(TRACK_W/2+5));
      var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,10,6),poleMat);
      pole.position.set(lp.x+lo.x,5,lp.z+lo.z);scene.add(pole);
      var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),bulbMat);
      bulb.position.set(lp.x+lo.x,10.5,lp.z+lo.z);scene.add(bulb);
    }
    // Only add actual PointLight every 4th pole (= 4 lights total)
    if(li%4===0){
      var lamp=new THREE.PointLight(0xffeedd,0.8,50);
      lamp.position.set(lp.x,11,lp.z);scene.add(lamp);
    }
  }

  // Crowd texture generator
  function makeCrowdTex(w,h){
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;
    var cx=cv.getContext('2d');
    cx.fillStyle='#1a1a2e';cx.fillRect(0,0,w,h);
    var crowdColors=['#e10600','#ff8700','#0090ff','#fff','#ffcc00','#00d2be','#ff69b4','#52e252','#ddd','#aaa','#8888ff','#ff5599'];
    for(var y=0;y<h;y+=3){for(var x=0;x<w;x+=2){
      if(Math.random()>0.15){cx.fillStyle=crowdColors[Math.floor(Math.random()*crowdColors.length)];cx.fillRect(x,y,1.5,2.5)}
    }}
    var t=new THREE.CanvasTexture(cv);t.minFilter=THREE.LinearFilter;return t;
  }

  // Grandstands with crowd (10 stands around the circuit)
  var standData=[
    {t:0.02,side:1,len:22,h:6},{t:0.08,side:-1,len:16,h:5},
    {t:0.18,side:1,len:20,h:7},{t:0.28,side:-1,len:14,h:5},
    {t:0.38,side:1,len:24,h:8},{t:0.48,side:-1,len:18,h:6},
    {t:0.58,side:1,len:16,h:5},{t:0.68,side:-1,len:22,h:7},
    {t:0.78,side:1,len:20,h:6},{t:0.88,side:-1,len:18,h:6}
  ];
  for(var si=0;si<standData.length;si++){
    var sd=standData[si];
    var sp=circuit.getPointAt(sd.t);
    var stan=circuit.getTangentAt(sd.t);
    var sright=new V().crossVectors(stan,new V(0,1,0)).normalize();
    var soff=sright.clone().multiplyScalar(sd.side*(TRACK_W/2+10));
    var sAng=Math.atan2(-stan.z,stan.x);
    // Stand structure (tiered)
    var sMat=new THREE.MeshPhongMaterial({color:0x1a1a2e});
    var stand=new THREE.Mesh(new THREE.BoxGeometry(sd.len,sd.h,7),sMat);
    stand.position.set(sp.x+soff.x,sd.h/2,sp.z+soff.z);
    stand.rotation.y=sAng;stand.castShadow=true;scene.add(stand);
    // Crowd face (front)
    var cTex=makeCrowdTex(128,64);
    var crowdFace=new THREE.Mesh(new THREE.PlaneGeometry(sd.len-0.5,sd.h-0.5),new THREE.MeshBasicMaterial({map:cTex}));
    var fwd=sright.clone().multiplyScalar(-sd.side*3.5);
    crowdFace.position.set(sp.x+soff.x+fwd.x,sd.h/2,sp.z+soff.z+fwd.z);
    crowdFace.rotation.y=sAng+(sd.side===1?Math.PI:0);
    scene.add(crowdFace);
    // Roof overhang
    var roof=new THREE.Mesh(new THREE.BoxGeometry(sd.len+2,0.3,8),new THREE.MeshPhongMaterial({color:0x222244}));
    roof.position.set(sp.x+soff.x,sd.h+0.15,sp.z+soff.z);
    roof.rotation.y=sAng;scene.add(roof);
    // Glow strip (visual only, no PointLight)
    var glow=new THREE.Mesh(new THREE.BoxGeometry(sd.len,0.15,0.15),new THREE.MeshBasicMaterial({color:0xffeedd}));
    glow.position.set(sp.x+soff.x+fwd.x*0.3,sd.h-0.2,sp.z+soff.z+fwd.z*0.3);
    glow.rotation.y=sAng;scene.add(glow);
  }

  // Advertising boards along outside barriers
  var adColors=[0xe10600,0x0090ff,0xffcc00,0x00d2be,0xff8700,0x52e252,0xff69b4,0x6644ff];
  function makeAdTex(color,text){
    var cv=document.createElement('canvas');cv.width=256;cv.height=32;
    var cx=cv.getContext('2d');
    cx.fillStyle=color;cx.fillRect(0,0,256,32);
    cx.fillStyle='#fff';cx.font='bold 18px sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(text,128,16);
    return new THREE.CanvasTexture(cv);
  }
  var adTexts=['RACING ROULETTE','SPEED','TURBO','NITRO','APEX','VELOCITY','GRAND PRIX','POLE POSITION'];
  for(var ai=0;ai<24;ai++){
    var at=ai/24;
    var ap=circuit.getPointAt(at);
    var atan2=circuit.getTangentAt(at);
    var aright=new V().crossVectors(atan2,new V(0,1,0)).normalize();
    var aside=(ai%3===0)?-1:1;
    var aoff=aright.clone().multiplyScalar(aside*(TRACK_W/2+1.8));
    var adTex=makeAdTex(['#e10600','#0090ff','#ffcc00','#00d2be','#ff8700','#52e252'][ai%6],adTexts[ai%adTexts.length]);
    var adBoard=new THREE.Mesh(new THREE.PlaneGeometry(3.5,0.8),new THREE.MeshBasicMaterial({map:adTex}));
    adBoard.position.set(ap.x+aoff.x,1.5,ap.z+aoff.z);
    adBoard.rotation.y=Math.atan2(-atan2.z,atan2.x)+(aside===1?Math.PI/2:-Math.PI/2);
    scene.add(adBoard);
  }

  // Pit lane buildings (along start/finish straight)
  var pitStart=circuit.getPointAt(0.95);
  var pitEnd=circuit.getPointAt(0.03);
  var pitTan=circuit.getTangentAt(0.99);
  var pitRight=new V().crossVectors(pitTan,new V(0,1,0)).normalize();
  var pitOff=pitRight.clone().multiplyScalar(-(TRACK_W/2+16));
  // Main pit building
  var pitBld=new THREE.Mesh(new THREE.BoxGeometry(40,4,8),new THREE.MeshPhongMaterial({color:0x1a1a3a}));
  pitBld.position.set((pitStart.x+pitEnd.x)/2+pitOff.x,2,(pitStart.z+pitEnd.z)/2+pitOff.z);
  pitBld.rotation.y=Math.atan2(-pitTan.z,pitTan.x);pitBld.castShadow=true;scene.add(pitBld);
  // Pit wall
  var pitWall=new THREE.Mesh(new THREE.BoxGeometry(40,1.2,0.3),new THREE.MeshPhongMaterial({color:0x444466}));
  var pitWallOff=pitRight.clone().multiplyScalar(-(TRACK_W/2+8));
  pitWall.position.set((pitStart.x+pitEnd.x)/2+pitWallOff.x,0.6,(pitStart.z+pitEnd.z)/2+pitWallOff.z);
  pitWall.rotation.y=Math.atan2(-pitTan.z,pitTan.x);scene.add(pitWall);
  // Pit gantry screens (info boards above pit)
  for(var pi=0;pi<3;pi++){
    var scrn=new THREE.Mesh(new THREE.BoxGeometry(6,2,0.2),new THREE.MeshBasicMaterial({color:0x112244}));
    var pOff2=pitRight.clone().multiplyScalar(-(TRACK_W/2+10));
    var ptp=circuit.getPointAt(0.96+pi*0.015);
    scrn.position.set(ptp.x+pOff2.x,5,ptp.z+pOff2.z);
    scrn.rotation.y=Math.atan2(-pitTan.z,pitTan.x);scene.add(scrn);
  }

  // Marshal posts with flags
  var marshalT=[0.12,0.25,0.37,0.5,0.62,0.75,0.87];
  var flagColors=[0x00ff00,0xffcc00,0x00ff00,0x0000ff,0x00ff00,0xffcc00,0x00ff00];
  for(var mi=0;mi<marshalT.length;mi++){
    var mp=circuit.getPointAt(marshalT[mi]);
    var mtan=circuit.getTangentAt(marshalT[mi]);
    var mright=new V().crossVectors(mtan,new V(0,1,0)).normalize();
    var moff=mright.clone().multiplyScalar((mi%2===0?1:-1)*(TRACK_W/2+4));
    // Post
    var mPole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,3,6),new THREE.MeshPhongMaterial({color:0x888888}));
    mPole.position.set(mp.x+moff.x,1.5,mp.z+moff.z);scene.add(mPole);
    // Flag
    var flag=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.4),new THREE.MeshBasicMaterial({color:flagColors[mi],side:THREE.DoubleSide}));
    flag.position.set(mp.x+moff.x+0.35,2.8,mp.z+moff.z);
    flag.rotation.y=Math.atan2(-mtan.z,mtan.x);scene.add(flag);
  }

  // Trees/vegetation outside track
  var treeMat=new THREE.MeshPhongMaterial({color:0x0a3a0a});
  var trunkMat=new THREE.MeshPhongMaterial({color:0x3a2a1a});
  for(var ti=0;ti<25;ti++){
    var tt=Math.random();
    var tp=circuit.getPointAt(tt);
    var ttan=circuit.getTangentAt(tt);
    var tright=new V().crossVectors(ttan,new V(0,1,0)).normalize();
    var tDist=TRACK_W/2+20+Math.random()*30;
    var tSide=Math.random()>0.5?1:-1;
    var tOff=tright.clone().multiplyScalar(tSide*tDist);
    var tx=tp.x+tOff.x+(Math.random()-0.5)*8;
    var tz=tp.z+tOff.z+(Math.random()-0.5)*8;
    // Trunk
    var tH=2+Math.random()*3;
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,tH,6),trunkMat);
    trunk.position.set(tx,tH/2,tz);scene.add(trunk);
    // Canopy
    var cR=1.2+Math.random()*1.5;
    var canopy=new THREE.Mesh(new THREE.SphereGeometry(cR,6,5),treeMat);
    canopy.position.set(tx,tH+cR*0.5,tz);canopy.castShadow=true;scene.add(canopy);
  }

  // Run-off gravel at corners
  var gravelMat=new THREE.MeshPhongMaterial({color:0x554433});
  var cornerTs=[0.12,0.28,0.42,0.55,0.7,0.85];
  for(var gi=0;gi<cornerTs.length;gi++){
    var gp=circuit.getPointAt(cornerTs[gi]);
    var gtan=circuit.getTangentAt(cornerTs[gi]);
    var gright=new V().crossVectors(gtan,new V(0,1,0)).normalize();
    for(var gs=-1;gs<=1;gs+=2){
      var goff=gright.clone().multiplyScalar(gs*(TRACK_W/2+4));
      var gravel=new THREE.Mesh(new THREE.PlaneGeometry(10,6),gravelMat);
      gravel.rotation.x=-Math.PI/2;gravel.position.set(gp.x+goff.x,0.01,gp.z+goff.z);
      gravel.rotation.z=-Math.atan2(-gtan.z,gtan.x);scene.add(gravel);
    }
  }

  // Camera crane structures at key points
  var craneMat=new THREE.MeshPhongMaterial({color:0x666666});
  var craneTs=[0.1,0.35,0.65,0.9];
  for(var cri=0;cri<craneTs.length;cri++){
    var crp=circuit.getPointAt(craneTs[cri]);
    var crtan=circuit.getTangentAt(craneTs[cri]);
    var crright=new V().crossVectors(crtan,new V(0,1,0)).normalize();
    var crOff=crright.clone().multiplyScalar((cri%2===0?1:-1)*(TRACK_W/2+6));
    // Vertical pole
    var crPole=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,12,6),craneMat);
    crPole.position.set(crp.x+crOff.x,6,crp.z+crOff.z);scene.add(crPole);
    // Arm
    var crArm=new THREE.Mesh(new THREE.BoxGeometry(4,0.15,0.15),craneMat);
    crArm.position.set(crp.x+crOff.x,12,crp.z+crOff.z);
    crArm.rotation.y=Math.atan2(-crtan.z,crtan.x);scene.add(crArm);
    // Camera box at end of arm
    var camBox=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.4),new THREE.MeshPhongMaterial({color:0x222222}));
    var armTip=new V().copy(crtan).multiplyScalar(-2*(cri%2===0?1:-1));
    camBox.position.set(crp.x+crOff.x+armTip.x,11.8,crp.z+crOff.z+armTip.z);scene.add(camBox);
    // Red light on camera
    var redLight=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),new THREE.MeshBasicMaterial({color:0xff0000}));
    redLight.position.copy(camBox.position);redLight.position.y-=0.2;scene.add(redLight);
  }

  // Colored glow markers at track corners (visual, no PointLight)
  var spotColors=[0xe10600,0x0090ff,0xff8700,0x00d2be,0xffcc00,0xff69b4];
  var spotTs=[0.1,0.25,0.4,0.55,0.7,0.85];
  for(var spi=0;spi<spotTs.length;spi++){
    var spp=circuit.getPointAt(spotTs[spi]);
    var sMarker=new THREE.Mesh(new THREE.SphereGeometry(0.5,6,6),new THREE.MeshBasicMaterial({color:spotColors[spi]}));
    sMarker.position.set(spp.x,11,spp.z);scene.add(sMarker);
  }

  // Start lights gantry (5 red light panels)
  var slp=circuit.getPointAt(0.99);
  var sltan=circuit.getTangentAt(0.99);
  var slright=new V().crossVectors(sltan,new V(0,1,0)).normalize();
  for(var sli=0;sli<5;sli++){
    var slOff=slright.clone().multiplyScalar((sli-2)*2.5);
    var slPanel=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.8,0.2),new THREE.MeshPhongMaterial({color:0x111111}));
    slPanel.position.set(slp.x+slOff.x,9,slp.z+slOff.z);
    slPanel.rotation.y=Math.atan2(-sltan.z,sltan.x);scene.add(slPanel);
    // Red bulbs
    for(var slb=-1;slb<=1;slb+=2){
      var bulbM=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),new THREE.MeshBasicMaterial({color:0xff0000}));
      bulbM.position.set(slp.x+slOff.x,9+slb*0.2,slp.z+slOff.z);scene.add(bulbM);
    }
  }

  // Stars (more of them)
  var starP=new Float32Array(1200*3);
  for(var si2=0;si2<1200;si2++){
    starP[si2*3]=(Math.random()-0.5)*500;
    starP[si2*3+1]=50+Math.random()*200;
    starP[si2*3+2]=(Math.random()-0.5)*500;
  }
  var starG=new THREE.BufferGeometry();
  starG.setAttribute('position',new THREE.BufferAttribute(starP,3));
  scene.add(new THREE.Points(starG,new THREE.PointsMaterial({color:0xffffff,size:0.4})));
  // Dim stars layer
  var starP2=new Float32Array(600*3);
  for(var si3=0;si3<600;si3++){
    starP2[si3*3]=(Math.random()-0.5)*400;
    starP2[si3*3+1]=80+Math.random()*120;
    starP2[si3*3+2]=(Math.random()-0.5)*400;
  }
  var starG2=new THREE.BufferGeometry();
  starG2.setAttribute('position',new THREE.BufferAttribute(starP2,3));
  scene.add(new THREE.Points(starG2,new THREE.PointsMaterial({color:0x8888ff,size:0.25,transparent:true,opacity:0.5})));

  // Cars on circuit
  for(var ci=0;ci<racers.length;ci++){
    var r=racers[ci];
    var car=createCar(hx(r.color));
    var laneOff=((ci/(Math.max(racers.length-1,1)))-0.5)*TRACK_W*0.55;
    car.userData={laneOffset:laneOff};
    scene.add(car);
    carMeshes[r.id]=car;
    var label=makeLabel(r.name,r.color);
    label.position.set(0,2.8,0);car.add(label);
    positionCarOnTrack(car,r.progress);
  }
}

/* ============ POSITION CAR ON CIRCUIT ============ */
function positionCarOnTrack(car,progress){
  var t=Math.max(0,Math.min(progress/100,0.9999));
  var pos=circuit.getPointAt(t);
  var tan=circuit.getTangentAt(t).normalize();
  var right=new V().crossVectors(tan,new V(0,1,0)).normalize();
  var offset=right.clone().multiplyScalar(car.userData.laneOffset);
  car.position.set(pos.x+offset.x,0,pos.z+offset.z);
  car.rotation.y=Math.atan2(-tan.z,tan.x);
}

/* ============ CAR MODEL ============ */
function createCar(color){
  var g=new THREE.Group();
  var mat=new THREE.MeshPhongMaterial({color:color,shininess:90,specular:0x444444});
  var dark=new THREE.MeshPhongMaterial({color:0x111111,shininess:100});
  // Body
  var body=new THREE.Mesh(new THREE.BoxGeometry(3.8,0.4,1.1),mat);
  body.position.y=0.45;body.castShadow=true;g.add(body);
  // Nose
  var nose=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.22,0.6),mat);
  nose.position.set(2.2,0.38,0);g.add(nose);
  // Cockpit
  var ck=new THREE.Mesh(new THREE.BoxGeometry(1,0.38,0.65),dark);
  ck.position.set(-0.2,0.82,0);g.add(ck);
  // Rear wing
  var rw=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.55,1.3),mat);
  rw.position.set(-2,0.9,0);g.add(rw);
  for(var ws=-1;ws<=1;ws+=2){
    var sup=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.45,0.06),dark);
    sup.position.set(-2,0.6,ws*0.5);g.add(sup);
  }
  // Front wing
  var fw=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.15,1.3),mat);
  fw.position.set(2.8,0.25,0);g.add(fw);
  // Wheels
  var wG=new THREE.CylinderGeometry(0.28,0.28,0.18,10);
  var wM=new THREE.MeshPhongMaterial({color:0x111111});
  [[1.3,0.28,0.65],[1.3,0.28,-0.65],[-1.3,0.28,0.65],[-1.3,0.28,-0.65]].forEach(function(p){
    var w=new THREE.Mesh(wG,wM);w.rotation.x=Math.PI/2;w.position.set(p[0],p[1],p[2]);g.add(w);
  });
  // Underglow (visual glow strip, no PointLight for performance)
  var glMesh=new THREE.Mesh(new THREE.PlaneGeometry(3,0.8),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.4}));
  glMesh.rotation.x=-Math.PI/2;glMesh.position.y=0.05;g.add(glMesh);
  // Tail light
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.6),new THREE.MeshBasicMaterial({color:0xff0000})),{position:new V(-1.95,0.5,0)}));
  return g;
}

function makeLabel(text,bgColor){
  var c=document.createElement('canvas');c.width=256;c.height=64;
  var ctx=c.getContext('2d');
  ctx.fillStyle=bgColor;ctx.fillRect(4,4,248,56);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text.substring(0,14),128,34);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(3.5,0.9,1);return sp;
}

/* ============ CAMERA (GTA CINEMATIC) ============ */
function startCameraSystem(){
  switchCam('wide');
  camTimer=setInterval(function(){
    if(phase!=='racing')return;
    var leader=getStandings()[0];
    var prog=leader?leader.progress:0;
    if(prog>85) switchCam(Math.random()<0.5?'chase':'lowdrama');
    else if(prog>50) switchCam(pick(['chase','lowdrama','orbit','trackside','helicopter']));
    else switchCam(pick(['wide','chase','helicopter','trackside','lowdrama','reverse','orbit']));
  },3200);
}

function switchCam(mode){
  cameraMode=mode;
  var cam=qs('#hCam');
  var labels={wide:'WIDE',chase:'CHASE CAM',helicopter:'HELICOPTER',trackside:'TRACKSIDE',lowdrama:'CINEMATIC',reverse:'REVERSE CAM',orbit:'ORBIT'};
  if(cam)cam.innerHTML='<span class="h-rec"></span>'+(labels[mode]||mode);
  doFlash();
}

function updateCamera(time){
  var sorted=getStandings();if(!sorted.length)return;
  var leader=sorted[0];
  var lCar=carMeshes[leader.id];if(!lCar)return;
  var lt=Math.min(leader.progress/100,0.9999);
  var lPos=circuit.getPointAt(lt);
  var lTan=circuit.getTangentAt(lt).normalize();
  var lRight=new V().crossVectors(lTan,new V(0,1,0)).normalize();

  // Pack center
  var cx=0,cz=0,cn=0;
  for(var i=0;i<Math.min(sorted.length,4);i++){
    var cm=carMeshes[sorted[i].id];
    if(cm){cx+=cm.position.x;cz+=cm.position.z;cn++}
  }
  if(cn){cx/=cn;cz/=cn}

  if(cameraMode==='wide'){
    camGoalPos.set(0,75,80);camGoalTarget.set(0,0,-5);camGoalFov=55;camLerp=0.02;
  }else if(cameraMode==='chase'){
    var behind=new V().copy(lPos).addScaledVector(lTan,-14).addScaledVector(lRight,2);
    behind.y=5;
    var ahead=new V().copy(lPos).addScaledVector(lTan,15);ahead.y=1;
    camGoalPos.copy(behind);camGoalTarget.copy(ahead);camGoalFov=68;camLerp=0.045;
  }else if(cameraMode==='helicopter'){
    camGoalPos.set(cx,55,cz+15);camGoalTarget.set(cx,0,cz);camGoalFov=50;camLerp=0.02;
  }else if(cameraMode==='trackside'){
    var sidePos=new V().copy(lPos).addScaledVector(lRight,TRACK_W/2+14);
    sidePos.y=3;
    var look=new V().copy(lPos).addScaledVector(lTan,5);look.y=1;
    camGoalPos.copy(sidePos);camGoalTarget.copy(look);camGoalFov=52;camLerp=0.035;
  }else if(cameraMode==='lowdrama'){
    var low=new V().copy(lPos).addScaledVector(lTan,-6).addScaledVector(lRight,5);
    low.y=1.2;
    var lookLow=new V().copy(lPos).addScaledVector(lTan,10);lookLow.y=1.5;
    camGoalPos.copy(low);camGoalTarget.copy(lookLow);camGoalFov=82;camLerp=0.03;
  }else if(cameraMode==='reverse'){
    var front=new V().copy(lPos).addScaledVector(lTan,16);front.y=4;
    var lookBack=new V().copy(lPos).addScaledVector(lTan,-10);lookBack.y=1;
    camGoalPos.copy(front);camGoalTarget.copy(lookBack);camGoalFov=60;camLerp=0.03;
  }else if(cameraMode==='orbit'){
    var angle=time*0.25;var radius=50;
    camGoalPos.set(cx+Math.cos(angle)*radius,20,cz+Math.sin(angle)*radius);
    camGoalTarget.set(cx,1,cz);camGoalFov=55;camLerp=0.022;
  }

  camPos.lerp(camGoalPos,camLerp);
  camTarget.lerp(camGoalTarget,camTLerp);
  currentFov+=(camGoalFov-currentFov)*0.02;
  camera.position.copy(camPos);camera.lookAt(camTarget);
  camera.fov=currentFov;camera.updateProjectionMatrix();
}

/* ============ RECORDING ============ */
function startRecording(){
  recordedChunks=[];
  var canvas=renderer.domElement;
  if(typeof canvas.captureStream!=='function'||typeof MediaRecorder==='undefined')return;
  var stream=canvas.captureStream(30);
  var mimeType='';
  var types=['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported(types[i])){mimeType=types[i];break}}
  if(!mimeType)return;
  mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:6000000});
  mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)recordedChunks.push(e.data)};
  mediaRecorder.start(200);
  qs('#recDot').style.display='flex';
}

function stopRecording(){
  if(!mediaRecorder||mediaRecorder.state==='inactive'){qs('#recDot').style.display='none';return}
  mediaRecorder.onstop=function(){
    if(recordedChunks.length===0){qs('#recDot').style.display='none';return}
    var mime=mediaRecorder.mimeType||'video/webm';
    var ext=mime.indexOf('mp4')!==-1?'mp4':'webm';
    var blob=new Blob(recordedChunks,{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;
    var d=new Date();var ts=d.getFullYear()+''+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+(d.getDate()<10?'0':'')+d.getDate()+'_'+(d.getHours()<10?'0':'')+d.getHours()+(d.getMinutes()<10?'0':'')+d.getMinutes();
    a.download='racing_roulette_'+ts+'.'+ext;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},200);
    qs('#recDot').style.display='none';
    mediaRecorder=null;recordedChunks=[];
  };
  mediaRecorder.stop();
}

function doFlash(){var f=qs('#flash');f.style.opacity='0.18';f.style.transition='opacity 0s';setTimeout(function(){f.style.transition='opacity .2s';f.style.opacity='0'},50)}
function showComment(t){var c=qs('#commentary');c.textContent=t;c.className='';void c.offsetWidth;c.className='show'}

/* ============ RACE LOGIC ============ */
function getStandings(){
  return racers.slice().sort(function(a,b){
    if(a.finished&&b.finished)return a.finishOrder-b.finishOrder;
    if(a.finished)return-1;if(b.finished)return 1;
    return b.progress-a.progress;
  });
}

function startRaceLoop(){
  var lastTime=performance.now();
  function tick(now){
    if(phase!=='racing')return;
    var dt=Math.min(now-lastTime,50);lastTime=now;var time=now*0.001;
    var allDone=true;
    for(var i=0;i<racers.length;i++){
      var r=racers[i];if(r.finished)continue;allDone=false;
      var jitter=(Math.random()-0.5)*0.7;
      var accel=r.speed+jitter;var isW=r.id===winnerId;var boost=0;
      if(r.progress>75){
        if(isW)boost=0.35+(r.progress-75)*0.02;
        else boost=-0.03-(r.progress-75)*0.012;
      }else if(r.progress>40){
        if(isW)boost=0.12;else boost=(Math.random()-0.5)*0.06;
      }else boost=(Math.random()-0.5)*0.1;
      var delta=(accel+boost)*(dt/16);
      r.progress=Math.min(r.progress+Math.max(delta,0.05),100);
      r.speed+=(Math.random()-0.5)*0.015;
      r.speed=Math.max(0.15,Math.min(0.6,r.speed));
      if(r.progress>=100&&!r.finished){r.finished=true;finishCount++;r.finishOrder=finishCount}
    }
    // Commentary
    var sorted=getStandings();
    if(sorted.length>0){
      var nl=sorted[0].id;
      if(lastLeaderId&&nl!==lastLeaderId&&sorted[0].progress>10&&sorted[0].progress<95){
        overtakeCount++;
        if(overtakeCount%2===0)showComment(sorted[0].name.toUpperCase()+' '+pick(C_LD));
        else showComment(pick(C_OV));
      }
      lastLeaderId=nl;
      if(sorted.length>=2&&Math.abs(sorted[0].progress-sorted[1].progress)<3&&sorted[0].progress>30&&sorted[0].progress<90&&Math.random()<0.006)showComment(pick(C_CL));
      if(sorted[0].progress>85&&sorted[0].progress<87)showComment(pick(C_FN));
    }
    // Update cars
    for(var ci=0;ci<racers.length;ci++){
      var rc=racers[ci];var mesh=carMeshes[rc.id];if(!mesh)continue;
      positionCarOnTrack(mesh,rc.progress);
      mesh.position.y=Math.sin(now*0.01+ci)*0.03;
    }
    updateCamera(time);updateHUD();
    renderer.render(scene,camera);
    if(allDone){
      phase='result';clearInterval(camTimer);cameraMode='orbit';
      setTimeout(showResult,1200);
      (function rr(t){updateCamera(t*0.001);renderer.render(scene,camera);if(phase==='result')requestAnimationFrame(rr)})(now);
      return;
    }
    animId=requestAnimationFrame(tick);
  }
  animId=requestAnimationFrame(tick);
}

/* ============ HUD ============ */
function updateHUD(){
  var box=qs('#hBoard');if(!box)return;
  var sorted=getStandings();
  var h='<div class="h-bt">STANDINGS</div>';
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];var pc=i===0?'g':i===1?'s':i===2?'b':'';
    h+='<div class="h-row"><span class="h-p '+pc+'">P'+(i+1)+'</span><span class="h-d" style="background:'+r.color+'"></span><span class="h-n">'+esc(r.name)+'</span></div>';
  }
  box.innerHTML=h;
  var bar=qs('#progBar');if(bar&&sorted.length)bar.style.width=sorted[0].progress+'%';
}

/* ============ UI SCREENS ============ */
function renderSetup(){
  var s=qs('#setupScreen');s.style.display='flex';
  s.innerHTML='<h1 class="s-title">Racing Roulette 3D</h1><p class="s-sub">Add options and watch them race on a full circuit!</p>';
  var form=document.createElement('form');form.className='s-form';
  form.innerHTML='<input type="text" id="mInp" placeholder="A, B, C, D (comma separated)" maxlength="200"/><button type="submit">Add</button>';
  form.onsubmit=function(e){
    e.preventDefault();var inp=qs('#mInp');var raw=inp.value.trim();
    if(!raw)return;
    var parts=raw.indexOf(',')!==-1?raw.split(','):[raw];
    for(var pi=0;pi<parts.length;pi++){
      var v=parts[pi].trim();
      if(!v||options.length>=12)continue;
      idCnt++;options.push({id:'o'+idCnt,name:v,color:COLORS[options.length%COLORS.length]});
    }
    renderSetup();setTimeout(function(){var i=qs('#mInp');if(i)i.focus()},10);
  };
  s.appendChild(form);
  var chips=document.createElement('div');chips.className='s-chips';
  for(var i=0;i<options.length;i++){
    (function(o,idx){
      var c=document.createElement('div');c.className='s-chip';
      c.innerHTML='<span class="s-dot" style="background:'+COLORS[idx%COLORS.length]+'"></span><span>'+esc(o.name)+'</span>';
      var x=document.createElement('button');x.className='s-x';x.innerHTML='&times;';
      x.onclick=function(){options=options.filter(function(z){return z.id!==o.id});for(var j=0;j<options.length;j++)options[j].color=COLORS[j%COLORS.length];renderSetup()};
      c.appendChild(x);chips.appendChild(c);
    })(options[i],i);
  }
  s.appendChild(chips);
  var recRow=document.createElement('div');recRow.className='s-rec';
  var recToggle=document.createElement('div');recToggle.className='s-toggle'+(recordEnabled?' on':'');
  recToggle.onclick=function(){recordEnabled=!recordEnabled;recToggle.className='s-toggle'+(recordEnabled?' on':'')};
  var recInfo=document.createElement('div');recInfo.className='s-rec-info';
  recInfo.innerHTML='<div class="s-rec-label">Record Race</div><div class="s-rec-sub">Auto-download video when race ends</div>';
  recRow.appendChild(recToggle);recRow.appendChild(recInfo);
  s.appendChild(recRow);
  var btn=document.createElement('button');btn.className='s-go';
  if(options.length<2){btn.disabled=true;btn.textContent='Add '+(2-options.length)+' more option'+(options.length===0?'s':'');}
  else btn.textContent='START RACE';
  btn.onclick=function(){if(options.length>=2)beginCountdown()};
  s.appendChild(btn);
}

function beginCountdown(){
  winnerId=options[Math.floor(Math.random()*options.length)].id;
  finishCount=0;lastLeaderId=null;overtakeCount=0;racers=[];
  for(var i=0;i<options.length;i++){var o=options[i];racers.push({id:o.id,name:o.name,color:o.color,progress:0,speed:0.3+Math.random()*0.2,finished:false,finishOrder:0})}
  qs('#setupScreen').style.display='none';
  buildScene();renderer.render(scene,camera);
  qs('#hud').style.display='block';qs('#progWrap').style.display='block';updateHUD();
  if(recordEnabled)startRecording();
  // Pre-race camera: aerial view of circuit
  camPos.set(0,90,60);camTarget.set(0,0,-10);
  camGoalPos.copy(camPos);camGoalTarget.copy(camTarget);
  camera.position.copy(camPos);camera.lookAt(camTarget);
  var cd=qs('#cdOverlay');cd.style.display='flex';var count=3;
  function ctick(){
    if(count>0){cd.innerHTML='<div class="cd-n">'+count+'</div>';count--;setTimeout(ctick,800)}
    else if(count===0){cd.innerHTML='<div class="cd-g">GO!</div>';count--;
      setTimeout(function(){cd.style.display='none';phase='racing';startRaceLoop();startCameraSystem()},500)}
  }
  (function pr(){renderer.render(scene,camera);if(phase!=='racing')requestAnimationFrame(pr)})();
  ctick();
}

function showResult(){
  var standings=getStandings();var w=standings[0];
  if(recordEnabled&&mediaRecorder&&mediaRecorder.state!=='inactive'){
    setTimeout(function(){stopRecording()},800);
  }
  var cb=document.createElement('div');cb.className='confetti-box';
  for(var i=0;i<60;i++){var p=document.createElement('div');p.className='conf';var sz=6+Math.random()*10;
    p.style.cssText='left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+CONF_C[i%CONF_C.length]+';border-radius:'+(Math.random()>0.5?'50%':'2px')+';animation-delay:'+Math.random()*2+'s;animation-duration:'+(2+Math.random()*2)+'s';
    cb.appendChild(p)}document.body.appendChild(cb);
  var medals=['\u{1F947}','\u{1F948}','\u{1F949}'];var pcls=['gd','sv','bz'];
  var ov=qs('#resultOverlay');ov.style.display='flex';
  var h='<div class="r-card"><div class="r-t">\u{1F3C6}</div><div class="r-l">WINNER</div><div class="r-w">'+esc(w.name)+'</div><div class="r-list"><div class="r-lt">Final Standings</div>';
  for(var i=0;i<standings.length;i++){var r=standings[i];
    h+='<div class="r-row"><span class="r-rp '+(pcls[i]||'')+'">'+(medals[i]||(i+1))+'</span><span class="r-rd" style="background:'+r.color+'"></span><span class="r-rn">'+esc(r.name)+'</span></div>'}
  h+='</div><button class="r-btn" id="resetBtn">Race Again</button></div>';
  ov.innerHTML=h;qs('#resetBtn').onclick=resetAll;
}

function resetAll(){
  cancelAnimationFrame(animId);clearInterval(camTimer);
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();mediaRecorder=null;recordedChunks=[]}
  qs('#recDot').style.display='none';
  phase='setup';racers=[];winnerId=null;finishCount=0;
  qs('#hud').style.display='none';qs('#progWrap').style.display='none';
  qs('#resultOverlay').style.display='none';qs('#resultOverlay').innerHTML='';
  var cb=document.querySelector('.confetti-box');if(cb)cb.remove();
  renderSetup();
}

/* ============ INIT ============ */
initThree();renderSetup();
(function idle(){renderer.render(scene,camera);if(phase==='setup')requestAnimationFrame(idle)})();
</script>
