<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Racing Roulette 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
canvas{display:block}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{font-family:inherit;outline:none;border:none}

#setupScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#15152a,#0a0a12 70%);z-index:100;padding:1.5rem}
.s-title{font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,#fff,#e10600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.2rem}
.s-sub{color:#666;font-size:.9rem;margin-bottom:1.8rem}
.s-form{display:flex;gap:.5rem;width:100%;max-width:460px;margin-bottom:1rem}
.s-form input{flex:1;padding:.7rem 1rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:1rem}
.s-form input:focus{border-color:#e10600}
.s-form input::placeholder{color:#555}
.s-form button{padding:.7rem 1.3rem;background:#e10600;color:#fff;border-radius:10px;font-weight:600;font-size:.95rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem;max-width:460px;justify-content:center}
.s-chip{display:flex;align-items:center;gap:.4rem;padding:.4rem .65rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;font-size:.82rem}
.s-dot{width:9px;height:9px;border-radius:50%}
.s-x{background:none;color:#666;font-size:1rem;padding:0;line-height:1}
.s-x:hover{color:#e10600}
.s-go{padding:1rem 3.5rem;background:linear-gradient(135deg,#e10600,#ff3333);color:#fff;border-radius:14px;font-size:1.2rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;transition:transform .15s,box-shadow .2s}
.s-go:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(225,6,0,.4)}
.s-go:disabled{opacity:.25;transform:none;box-shadow:none;cursor:not-allowed}

#hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;display:none}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;padding:.8rem 1.2rem}
.h-board{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.6rem .8rem;min-width:150px;border:1px solid rgba(255,255,255,.08)}
.h-bt{font-size:.6rem;color:#666;text-transform:uppercase;letter-spacing:.12em;margin-bottom:.4rem;font-weight:700}
.h-row{display:flex;align-items:center;gap:.45rem;padding:.2rem 0;font-size:.75rem;font-weight:600}
.h-p{width:20px;font-weight:800;color:#666}
.h-p.g{color:#ffd700}.h-p.s{color:#c0c0c0}.h-p.b{color:#cd7f32}
.h-d{width:7px;height:7px;border-radius:50%}
.h-n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-cam{background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.5rem .9rem;font-size:.65rem;color:#e10600;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border:1px solid rgba(225,6,0,.25);display:flex;align-items:center;gap:.45rem}
.h-rec{width:7px;height:7px;border-radius:50%;background:#e10600;animation:bk 1s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
#progWrap{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);z-index:20;display:none}
#progBar{height:100%;width:0;background:linear-gradient(90deg,#e10600,#ffcc00);transition:width .15s}
.h-lap{position:fixed;top:.8rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border-radius:10px;padding:.5rem 1.2rem;font-size:.8rem;font-weight:700;z-index:20;display:none;border:1px solid rgba(255,255,255,.08);letter-spacing:.05em}

#commentary{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(225,6,0,.9),0 0 100px rgba(225,6,0,.3),0 4px 20px rgba(0,0,0,.8);z-index:30;pointer-events:none;white-space:nowrap;opacity:0;letter-spacing:.04em}
#commentary.show{animation:cpop .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(2.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}

#cdOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:40}
.cd-n{font-size:14rem;font-weight:900;color:#e10600;text-shadow:0 0 120px rgba(225,6,0,.7);animation:cdp .65s ease-out}
.cd-g{font-size:9rem;font-weight:900;color:#00dd44;text-shadow:0 0 120px rgba(0,221,68,.6);animation:cdp .45s ease-out}
@keyframes cdp{0%{transform:scale(3.5);opacity:0}35%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.85}}

#resultOverlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,204,0,.12),rgba(0,0,0,.9) 60%);display:none;align-items:center;justify-content:center;z-index:50}
.r-card{background:#141428;border:1px solid #2a2a4a;border-radius:24px;padding:2.5rem;text-align:center;max-width:420px;width:90%;animation:rpop .7s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.r-card::before{content:'';position:absolute;inset:-2px;border-radius:25px;background:linear-gradient(135deg,#ffcc00,#e10600,#ffcc00,#fff,#ffcc00);background-size:400% 400%;z-index:-1;opacity:.7;animation:rborder 3s ease infinite}
@keyframes rborder{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes rpop{0%{opacity:0;transform:scale(.3) translateY(60px)}50%{opacity:1;transform:scale(1.05) translateY(-5px)}70%{transform:scale(0.97) translateY(2px)}100%{transform:scale(1) translateY(0)}}
.r-t{font-size:4.5rem;margin-bottom:.5rem;animation:tb .9s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes tb{0%{transform:scale(0) rotate(-30deg)}50%{transform:scale(1.4) rotate(8deg)}75%{transform:scale(0.95) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.r-l{font-size:.75rem;color:#e10600;text-transform:uppercase;letter-spacing:.2em;margin-bottom:.5rem;font-weight:700;animation:rlFade .4s ease .5s both}
@keyframes rlFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.r-w{font-size:2.3rem;font-weight:900;background:linear-gradient(90deg,#ffcc00,#fff,#ffcc00,#fff,#ffcc00);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem;animation:rshine 2s linear infinite,rwFade .5s ease .8s both}
@keyframes rshine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes rwFade{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.r-list{text-align:left;margin-bottom:1.5rem}
.r-lt{font-size:.65rem;color:#666;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;font-weight:600}
.r-row{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;font-size:.85rem}
.r-row+.r-row{border-top:1px solid rgba(255,255,255,.05)}
.r-rp{font-weight:700;width:26px;text-align:center;font-size:.8rem}
.r-rp.gd{color:#ffd700}.r-rp.sv{color:#c0c0c0}.r-rp.bz{color:#cd7f32}
.r-rd{width:7px;height:7px;border-radius:50%}
.r-rn{flex:1}
.r-btn{padding:.8rem 2.5rem;background:linear-gradient(135deg,#e10600,#ff3333);color:#fff;border-radius:12px;font-size:1rem;font-weight:700;transition:transform .15s,box-shadow .2s}
.r-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(225,6,0,.4)}
.confetti-box{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.conf{position:absolute;top:-20px;animation:cfl linear forwards}
@keyframes cfl{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:35;transition:opacity .15s}

.s-rec{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem;padding:.7rem 1rem;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;max-width:460px;width:100%}
.s-rec-info{flex:1}
.s-rec-label{font-size:.88rem;color:#ccc;font-weight:600}
.s-rec-sub{font-size:.68rem;color:#666;margin-top:.1rem}
.s-toggle{position:relative;width:44px;height:24px;background:#333;border-radius:12px;cursor:pointer;transition:background .2s;flex-shrink:0}
.s-toggle.on{background:#e10600}
.s-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s}
.s-toggle.on::after{left:22px}
#recDot{position:fixed;top:.8rem;right:.8rem;display:none;align-items:center;gap:.4rem;padding:.35rem .7rem;background:rgba(225,6,0,.9);border-radius:8px;font-size:.7rem;font-weight:700;z-index:25;letter-spacing:.05em}
#recDot .rd-blink{width:8px;height:8px;border-radius:50%;background:#fff;animation:bk 1s infinite}

@media(max-width:600px){
  .s-title{font-size:1.7rem}#commentary{font-size:1.8rem}.cd-n{font-size:8rem}.cd-g{font-size:5rem}
  .h-board{min-width:110px;padding:.4rem .6rem}.h-row{font-size:.65rem}.r-card{padding:1.5rem}.r-w{font-size:1.5rem}
}
</style>
</head>
<body>
<div id="setupScreen"></div>
<div id="hud"><div class="h-top"><div class="h-board" id="hBoard"></div><div class="h-cam" id="hCam"><span class="h-rec"></span>WIDE</div></div></div>
<div id="progWrap"><div id="progBar"></div></div>
<div class="h-lap" id="lapDisp"></div>
<div id="commentary"></div>
<div id="cdOverlay"></div>
<div id="resultOverlay"></div>
<div id="flash"></div>
<div id="recDot"><span class="rd-blink"></span>REC</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ CONFIG ============ */
var COLORS=['#e10600','#0090ff','#ff8700','#00d2be','#2b4562','#27f4d2','#b6babd','#ff69b4','#52e252','#ffcc00','#ff5599','#6644ff','#00cc66','#ff4444','#8844cc','#cc8800','#44aaff','#ff66cc','#22ddaa','#aa44ff'];
var TOTAL_LAPS=3;
var CONF_C=['#e10600','#ffcc00','#0090ff','#00d2be','#ff8700','#fff','#52e252','#ff69b4'];
var C_OV=['OVERTAKE!','WHAT A MOVE!','INCREDIBLE!','UNBELIEVABLE!'];
var C_LD=['TAKES THE LEAD!','OUT IN FRONT!','LEADING THE PACK!'];
var C_FN=['FINAL STRETCH!','HERE WE GO!','ALMOST THERE!'];
var C_CL=['NECK AND NECK!','SO CLOSE!','SIDE BY SIDE!'];
var TRACK_W=14;

/* ============ CIRCUIT DEFINITION ============ */
var V=THREE.Vector3;
var circuitPts=[
  new V(-25,0,-55),new V(20,0,-57),         // Start/finish straight
  new V(48,0,-50),new V(62,0,-35),           // T1 entry
  new V(65,0,-12),                            // T1 apex
  new V(58,0,8),new V(65,0,22),              // T2 kink
  new V(55,0,40),new V(38,0,52),             // T3 sweeper
  new V(12,0,58),new V(-10,0,55),            // T4 hairpin entry
  new V(-28,0,42),                            // T4 apex
  new V(-40,0,30),new V(-55,0,18),           // T5 entry
  new V(-62,0,-2),                            // T5 apex
  new V(-58,0,-22),new V(-48,0,-38),         // T6
  new V(-38,0,-52)                            // T6 exit -> back to start
];

/* ============ STATE ============ */
var options=[],racers=[],phase='setup';
var animId=0,winnerId=null,finishCount=0,idCnt=0;
var cameraMode='wide',camTimer=null;
var lastLeaderId=null,overtakeCount=0;
var scene,camera,renderer,circuit;
var carMeshes={};
var camPos,camTarget,camGoalPos,camGoalTarget,camGoalFov;
var currentFov=60,camLerp=0.03,camTLerp=0.04;
var recordEnabled=false,mediaRecorder=null,recordedChunks=[],recordStopQueued=false,recCanvas=null,recCtx=null;

function qs(s){return document.querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function hx(h){return parseInt(h.replace('#',''),16)}

/* ============ THREE.JS ============ */
function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x020212);
  scene.fog=new THREE.FogExp2(0x050520,0.0025);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,600);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.NoToneMapping;
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  camPos=new V(0,80,100);camTarget=new V(0,0,0);
  camGoalPos=new V(0,80,100);camGoalTarget=new V(0,0,0);camGoalFov=60;
  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
}

/* ============ TRACK MESH BUILDER ============ */
function buildRibbonGeo(curve,width,segs,yOff){
  var verts=[],idx=[],uvs=[];
  for(var i=0;i<=segs;i++){
    var t=i/segs;
    var p=curve.getPointAt(t);
    var tan=curve.getTangentAt(t);
    var right=new V().crossVectors(tan,new V(0,1,0)).normalize();
    var l=new V().copy(p).addScaledVector(right,-width/2);
    var r=new V().copy(p).addScaledVector(right,width/2);
    verts.push(l.x,yOff,l.z, r.x,yOff,r.z);
    uvs.push(0,t*width*2, 1,t*width*2);
    if(i<segs){var b=i*2;idx.push(b,b+2,b+1,b+1,b+2,b+3)}
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

/* ============ BUILD SCENE ============ */
function buildScene(){
  while(scene.children.length>0)scene.remove(scene.children[0]);
  carMeshes={};
  circuit=new THREE.CatmullRomCurve3(circuitPts,true,'catmullrom',0.5);
  // Clamp t to safe range - r128 can return undefined at boundaries
  var _gpa=circuit.getPointAt.bind(circuit);
  var _gta=circuit.getTangentAt.bind(circuit);
  circuit.getPointAt=function(t){return _gpa(Math.max(0.0001,Math.min(t,0.9999)))};
  circuit.getTangentAt=function(t){return _gta(Math.max(0.0001,Math.min(t,0.9999)))};

  // Night lighting (dim ambient + moonlight + track floodlights)
  scene.add(new THREE.AmbientLight(0x1a1a3a,0.4));
  var moon=new THREE.DirectionalLight(0x6677aa,0.3);
  moon.position.set(50,80,-30);moon.castShadow=true;
  moon.shadow.mapSize.set(1024,1024);
  moon.shadow.camera.left=-80;moon.shadow.camera.right=80;
  moon.shadow.camera.top=70;moon.shadow.camera.bottom=-70;
  scene.add(moon);

  // Night sky dome with stars
  var skyCV=document.createElement('canvas');skyCV.width=512;skyCV.height=256;
  var skyCx=skyCV.getContext('2d');
  var skyGrad=skyCx.createLinearGradient(0,0,0,256);
  skyGrad.addColorStop(0,'#000008');skyGrad.addColorStop(0.4,'#080820');
  skyGrad.addColorStop(0.7,'#101035');skyGrad.addColorStop(1,'#1a1040');
  skyCx.fillStyle=skyGrad;skyCx.fillRect(0,0,512,256);
  // Stars
  for(var sti=0;sti<400;sti++){
    var sx=Math.random()*512,sy=Math.random()*180;
    var bright=0.3+Math.random()*0.7;
    skyCx.fillStyle='rgba(255,255,255,'+bright+')';
    skyCx.fillRect(sx,sy,Math.random()>0.9?2:1,Math.random()>0.9?2:1);
  }
  // City glow on horizon
  var glowGrad=skyCx.createLinearGradient(0,200,0,256);
  glowGrad.addColorStop(0,'rgba(255,150,50,0)');glowGrad.addColorStop(0.5,'rgba(255,120,40,0.08)');glowGrad.addColorStop(1,'rgba(255,100,30,0.15)');
  skyCx.fillStyle=glowGrad;skyCx.fillRect(0,200,512,56);
  var skyTex=new THREE.CanvasTexture(skyCV);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(280,16,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false})));

  // Vegas skyline buildings (distant)
  var bldgColors=[0x1a1a3a,0x151530,0x0a0a25,0x121238,0x181840];
  var neonColors=[0xff0055,0x00ffcc,0xffaa00,0x8855ff,0x00aaff,0xff3366,0xffdd00,0x55ff55];
  for(var bi2=0;bi2<30;bi2++){
    var bAngle=bi2/30*Math.PI*2;var bDist=140+Math.random()*50;
    var bH=8+Math.random()*35;var bW=3+Math.random()*8;
    var bldg=new THREE.Mesh(new THREE.BoxGeometry(bW,bH,bW*0.6),new THREE.MeshPhongMaterial({color:bldgColors[bi2%bldgColors.length]}));
    bldg.position.set(Math.cos(bAngle)*bDist,bH/2-2,Math.sin(bAngle)*bDist);
    bldg.rotation.y=Math.random()*Math.PI;scene.add(bldg);
    // Neon accent strip on building
    var neonH=0.3+Math.random()*0.6;
    var neon=new THREE.Mesh(new THREE.BoxGeometry(bW+0.1,neonH,bW*0.6+0.1),new THREE.MeshBasicMaterial({color:neonColors[bi2%neonColors.length]}));
    neon.position.set(Math.cos(bAngle)*bDist,bH*0.6+Math.random()*bH*0.3,Math.sin(bAngle)*bDist);
    neon.rotation.y=bldg.rotation.y;scene.add(neon);
    // Window dots on some buildings
    if(bH>15&&Math.random()>0.3){
      var winCV=document.createElement('canvas');winCV.width=32;winCV.height=64;
      var wCx=winCV.getContext('2d');wCx.fillStyle='#0a0a20';wCx.fillRect(0,0,32,64);
      for(var wy=0;wy<64;wy+=4){for(var wx=0;wx<32;wx+=4){if(Math.random()>0.4){wCx.fillStyle='rgba(255,220,150,'+(0.2+Math.random()*0.5)+')';wCx.fillRect(wx,wy,2,2)}}}
      var winTex=new THREE.CanvasTexture(winCV);winTex.wrapS=winTex.wrapT=THREE.RepeatWrapping;
      var winFace=new THREE.Mesh(new THREE.PlaneGeometry(bW,bH),new THREE.MeshBasicMaterial({map:winTex,transparent:true}));
      winFace.position.set(Math.cos(bAngle)*bDist,bH/2,Math.sin(bAngle)*bDist);
      winFace.lookAt(0,bH/2,0);scene.add(winFace);
    }
  }

  // Ground (dark asphalt city ground)
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshPhongMaterial({color:0x0a0a12}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.1;ground.receiveShadow=true;
  scene.add(ground);

  // Tarmac run-off area (medium grey, darker than track)
  var runoffCV=document.createElement('canvas');runoffCV.width=64;runoffCV.height=64;
  var roCx=runoffCV.getContext('2d');roCx.fillStyle='#687070';roCx.fillRect(0,0,64,64);
  for(var roi=0;roi<120;roi++){roCx.fillStyle=Math.random()>0.5?'#606868':'#707878';roCx.fillRect(Math.random()*64,Math.random()*64,2+Math.random()*3,2+Math.random()*3)}
  var runoffTex=new THREE.CanvasTexture(runoffCV);runoffTex.wrapS=runoffTex.wrapT=THREE.RepeatWrapping;runoffTex.repeat.set(30,30);
  var runoffGeo=buildRibbonGeo(circuit,TRACK_W+12,500,0.008);
  scene.add(new THREE.Mesh(runoffGeo,new THREE.MeshBasicMaterial({map:runoffTex})));

  // Track surface (bright grey asphalt - clearly visible)
  var trackCV=document.createElement('canvas');trackCV.width=128;trackCV.height=128;
  var tCx=trackCV.getContext('2d');tCx.fillStyle='#808888';tCx.fillRect(0,0,128,128);
  for(var txi=0;txi<200;txi++){tCx.fillStyle=Math.random()>0.5?'#778080':'#8a9090';tCx.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*3,1+Math.random()*3)}
  // Rubber marks / tire traces
  tCx.fillStyle='#6a7070';
  for(var rmi=0;rmi<15;rmi++){tCx.fillRect(Math.random()*128,Math.random()*128,1,8+Math.random()*20)}
  var trackTex2=new THREE.CanvasTexture(trackCV);trackTex2.wrapS=trackTex2.wrapT=THREE.RepeatWrapping;trackTex2.repeat.set(40,40);
  var trackGeo=buildRibbonGeo(circuit,TRACK_W,500,0.02);
  var trackMesh=new THREE.Mesh(trackGeo,new THREE.MeshBasicMaterial({map:trackTex2}));
  scene.add(trackMesh);

  // White track edge lines (F1 style)
  for(var el=-1;el<=1;el+=2){
    var elGeo=buildRibbonGeo(circuit,0.3,500,0.035);
    var elPos=elGeo.attributes.position.array;
    for(var eli=0;eli<=500;eli++){
      var elt=eli/500;

    mHut.position.set(mp.x+moff.x,1,mp.z+moff.z);mHut.rotation.y=Math.atan2(-mtan.z,mtan.x);scene.add(mHut);
    // Post
    var mPole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,4,6),new THREE.MeshPhongMaterial({color:0x888888}));
    mPole.position.set(mp.x+moff.x,2,mp.z+moff.z);scene.add(mPole);
    // Flag
    var flag=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.45),new THREE.MeshBasicMaterial({color:flagColors[mi],side:THREE.DoubleSide}));
    flag.position.set(mp.x+moff.x+0.4,3.8,mp.z+moff.z);
    flag.rotation.y=Math.atan2(-mtan.z,mtan.x);scene.add(flag);
  }

  // Vegas palm trees (sparse)
  var palmLeafMat=new THREE.MeshPhongMaterial({color:0x1a5a1a});
  var palmTrunkMat=new THREE.MeshPhongMaterial({color:0x4a3a2a});
  for(var ti=0;ti<12;ti++){
    var tt=Math.random();
    var tp=circuit.getPointAt(tt);
    var ttan=circuit.getTangentAt(tt);
    var tright=new V().crossVectors(ttan,new V(0,1,0)).normalize();
    var tDist=TRACK_W/2+22+Math.random()*20;
    var tSide=Math.random()>0.5?1:-1;
    var tOff=tright.clone().multiplyScalar(tSide*tDist);
    var tx=tp.x+tOff.x,tz=tp.z+tOff.z;
    var tH=6+Math.random()*4;
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.25,tH,6),palmTrunkMat);
    trunk.position.set(tx,tH/2,tz);scene.add(trunk);
    // Palm fronds (flat ellipses)
    for(var pf=0;pf<6;pf++){
      var frond=new THREE.Mesh(new THREE.PlaneGeometry(3,0.8),new THREE.MeshBasicMaterial({color:0x1a6a1a,side:THREE.DoubleSide,transparent:true,opacity:0.8}));
      frond.position.set(tx,tH+0.5,tz);
      frond.rotation.y=pf/6*Math.PI*2;frond.rotation.x=-0.5;scene.add(frond);
    }
    // Tiny uplights on some palms
    if(Math.random()>0.5){
      var uplight=new THREE.PointLight(0xffaa44,0.3,15);
      uplight.position.set(tx,0.5,tz);scene.add(uplight);
    }
  }

  // F1 corner run-off zones (colored tarmac + gravel traps)
  var cornerTs=[0.12,0.28,0.42,0.55,0.7,0.85];
  var cornerRunoffColors=[0x0044aa,0xcc0000,0x0044aa,0xcc0000,0x0044aa,0xcc0000];
  for(var gi=0;gi<cornerTs.length;gi++){
    var gp=circuit.getPointAt(cornerTs[gi]);
    var gtan=circuit.getTangentAt(cornerTs[gi]);
    var gright=new V().crossVectors(gtan,new V(0,1,0)).normalize();
    for(var gs=-1;gs<=1;gs+=2){
      // Blue/Red painted run-off (like Paul Ricard)
      var paintOff=gright.clone().multiplyScalar(gs*(TRACK_W/2+3));
      var paintRunoff=new THREE.Mesh(new THREE.PlaneGeometry(14,8),new THREE.MeshPhongMaterial({color:cornerRunoffColors[gi]}));
      paintRunoff.rotation.x=-Math.PI/2;paintRunoff.position.set(gp.x+paintOff.x,0.012,gp.z+paintOff.z);
      paintRunoff.rotation.z=-Math.atan2(-gtan.z,gtan.x);scene.add(paintRunoff);
      // White stripes on painted run-off
      for(var stri=0;stri<3;stri++){
        var strOff=gright.clone().multiplyScalar(gs*(TRACK_W/2+1.5+stri*2));
        var stripe=new THREE.Mesh(new THREE.PlaneGeometry(13,0.2),new THREE.MeshBasicMaterial({color:0xffffff}));
        stripe.rotation.x=-Math.PI/2;stripe.position.set(gp.x+strOff.x,0.015,gp.z+strOff.z);
        stripe.rotation.z=-Math.atan2(-gtan.z,gtan.x);scene.add(stripe);
      }
      // Gravel trap beyond painted area
      var gravelOff=gright.clone().multiplyScalar(gs*(TRACK_W/2+9));
      var gravelCV=document.createElement('canvas');gravelCV.width=32;gravelCV.height=32;
      var grCx=gravelCV.getContext('2d');grCx.fillStyle='#887755';grCx.fillRect(0,0,32,32);
      for(var gri2=0;gri2<60;gri2++){grCx.fillStyle=Math.random()>0.5?'#776644':'#998866';grCx.fillRect(Math.random()*32,Math.random()*32,1+Math.random()*2,1+Math.random()*2)}
      var gravelTex=new THREE.CanvasTexture(gravelCV);
      var gravel=new THREE.Mesh(new THREE.PlaneGeometry(8,6),new THREE.MeshPhongMaterial({map:gravelTex}));
      gravel.rotation.x=-Math.PI/2;gravel.position.set(gp.x+gravelOff.x,0.009,gp.z+gravelOff.z);
      gravel.rotation.z=-Math.atan2(-gtan.z,gtan.x);scene.add(gravel);
    }
  }

  // DRS zones (green boards + detection/activation markings)
  var drsZones=[{detect:0.88,start:0.92,end:0.02},{detect:0.35,start:0.38,end:0.48}];
  var drsBoardMat=new THREE.MeshBasicMaterial({color:0x00cc44});
  for(var dzi=0;dzi<drsZones.length;dzi++){
    var dz=drsZones[dzi];
    // DRS detection board
    var ddp=circuit.getPointAt(dz.detect);
    var ddtan=circuit.getTangentAt(dz.detect);
    var ddright=new V().crossVectors(ddtan,new V(0,1,0)).normalize();
    for(var dds=-1;dds<=1;dds+=2){
      var ddoff=ddright.clone().multiplyScalar(dds*(TRACK_W/2+1));
      var dBoard=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.5,0.15),drsBoardMat);
      dBoard.position.set(ddp.x+ddoff.x,0.75,ddp.z+ddoff.z);dBoard.rotation.y=Math.atan2(-ddtan.z,ddtan.x);scene.add(dBoard);
    }
    // DRS start green line on track
    var dsp=circuit.getPointAt(dz.start);
    var dstan=circuit.getTangentAt(dz.start);
    var dsLine=new THREE.Mesh(new THREE.PlaneGeometry(TRACK_W-1,0.4),new THREE.MeshBasicMaterial({color:0x00cc44}));
    dsLine.rotation.x=-Math.PI/2;dsLine.position.set(dsp.x,0.035,dsp.z);
    dsLine.rotation.z=-Math.atan2(-dstan.z,dstan.x);scene.add(dsLine);
  }

  // Camera crane structures at key points
  var craneMat=new THREE.MeshPhongMaterial({color:0x666666});
  var craneTs=[0.1,0.35,0.65,0.9];
  for(var cri=0;cri<craneTs.length;cri++){
    var crp=circuit.getPointAt(craneTs[cri]);
    var crtan=circuit.getTangentAt(craneTs[cri]);
    var crright=new V().crossVectors(crtan,new V(0,1,0)).normalize();
    var crOff=crright.clone().multiplyScalar((cri%2===0?1:-1)*(TRACK_W/2+9));
    // Vertical pole
    var crPole=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,12,6),craneMat);
    crPole.position.set(crp.x+crOff.x,6,crp.z+crOff.z);scene.add(crPole);
    // Arm
    var crArm=new THREE.Mesh(new THREE.BoxGeometry(4,0.15,0.15),craneMat);
    crArm.position.set(crp.x+crOff.x,12,crp.z+crOff.z);
    crArm.rotation.y=Math.atan2(-crtan.z,crtan.x);scene.add(crArm);
    // Camera box at end of arm
    var camBox=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.4),new THREE.MeshPhongMaterial({color:0x222222}));
    var armTip=new V().copy(crtan).multiplyScalar(-2*(cri%2===0?1:-1));
    camBox.position.set(crp.x+crOff.x+armTip.x,11.8,crp.z+crOff.z+armTip.z);scene.add(camBox);
    // Red light on camera
    var redLight=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),new THREE.MeshBasicMaterial({color:0xff0000}));
    redLight.position.copy(camBox.position);redLight.position.y-=0.2;scene.add(redLight);
  }

  // Colored glow markers at track corners (visual, no PointLight)
  var spotColors=[0xe10600,0x0090ff,0xff8700,0x00d2be,0xffcc00,0xff69b4];
  var spotTs=[0.1,0.25,0.4,0.55,0.7,0.85];
  for(var spi=0;spi<spotTs.length;spi++){
    var spp=circuit.getPointAt(spotTs[spi]);
    var sMarker=new THREE.Mesh(new THREE.SphereGeometry(0.5,6,6),new THREE.MeshBasicMaterial({color:spotColors[spi]}));
    sMarker.position.set(spp.x,11,spp.z);scene.add(sMarker);
  }

  // Start lights gantry (5 red light panels)
  var slp=circuit.getPointAt(0.99);
  var sltan=circuit.getTangentAt(0.99);
  var slright=new V().crossVectors(sltan,new V(0,1,0)).normalize();
  for(var sli=0;sli<5;sli++){
    var slOff=slright.clone().multiplyScalar((sli-2)*2.5);
    var slPanel=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.8,0.2),new THREE.MeshPhongMaterial({color:0x111111}));
    slPanel.position.set(slp.x+slOff.x,9,slp.z+slOff.z);
    slPanel.rotation.y=Math.atan2(-sltan.z,sltan.x);scene.add(slPanel);
    // Red bulbs
    for(var slb=-1;slb<=1;slb+=2){
      var bulbM=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),new THREE.MeshBasicMaterial({color:0xff0000}));
      bulbM.position.set(slp.x+slOff.x,9+slb*0.2,slp.z+slOff.z);scene.add(bulbM);
    }
  }

  // Vegas neon signs (floating near buildings)
  var signTexts=['LUCKY','JACKPOT','VEGAS','ACE','777','CASINO','ROYAL','GRAND'];
  var signColors=['#ff0055','#00ffcc','#ffaa00','#ff3366','#00aaff','#ffdd00','#ff55aa','#55ffaa'];
  for(var vsi=0;vsi<8;vsi++){
    var vsAngle=vsi/8*Math.PI*2+0.2;var vsDist=120+Math.random()*20;
    var vsCV=document.createElement('canvas');vsCV.width=128;vsCV.height=32;
    var vsCx=vsCV.getContext('2d');vsCx.fillStyle=signColors[vsi];vsCx.font='bold 22px sans-serif';
    vsCx.textAlign='center';vsCx.textBaseline='middle';vsCx.fillText(signTexts[vsi],64,16);
    var vsTex=new THREE.CanvasTexture(vsCV);
    var vsBoard=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:vsTex,transparent:true}));
    vsBoard.position.set(Math.cos(vsAngle)*vsDist,15+Math.random()*10,Math.sin(vsAngle)*vsDist);
    vsBoard.lookAt(0,vsBoard.position.y,0);scene.add(vsBoard);
  }

  // Cars on circuit
  for(var ci=0;ci<racers.length;ci++){
    var r=racers[ci];
    var car=createCar(hx(r.color));
    var laneOff=((ci/(Math.max(racers.length-1,1)))-0.5)*TRACK_W*0.55;
    car.userData={laneOffset:laneOff};
    scene.add(car);
    carMeshes[r.id]=car;
    var label=makeLabel(r.name,r.color);
    label.position.set(0,2.8,0);car.add(label);
    positionCarOnTrack(car,r.progress);
  }
}

/* ============ POSITION CAR ON CIRCUIT ============ */
function positionCarOnTrack(car,progress){
  var t=Math.max(0,Math.min((progress%100)/100,0.9999));
  var pos=circuit.getPointAt(t);
  var tan=circuit.getTangentAt(t).normalize();
  var right=new V().crossVectors(tan,new V(0,1,0)).normalize();
  var offset=right.clone().multiplyScalar(car.userData.laneOffset);
  car.position.set(pos.x+offset.x,0,pos.z+offset.z);
  car.rotation.y=Math.atan2(-tan.z,tan.x);
}

/* ============ CAR MODEL ============ */
function createCar(color){

  var dark=new THREE.MeshPhongMaterial({color:0x111111,shininess:100});

  // Nose (long, tapered)
  var nose=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.18,0.5),mat);
  nose.position.set(2.4,0.38,0);g.add(nose);
  // Sidepods
  for(var sp=-1;sp<=1;sp+=2){
    var sidepod=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.3,0.25),mat);

  }
  // Cockpit
  var ck=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.3,0.55),dark);
  ck.position.set(0.2,0.78,0);g.add(ck);
  // Driver helmet
  var helmet=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6),mat);
  helmet.position.set(0.1,0.95,0);g.add(helmet);
  // Halo
  var haloBar=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.06,0.5),carbon);
  haloBar.position.set(0.45,0.95,0);g.add(haloBar);
  var haloPillar=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.22,0.06),carbon);
  haloPillar.position.set(0.8,0.84,0);g.add(haloPillar);
  // Airbox (intake above driver)
  var airbox=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.35,0.3),mat);
  airbox.position.set(-0.4,0.82,0);g.add(airbox);
  // Engine cover (tapers to rear)
  var engCover=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.22,0.55),mat);
  engCover.position.set(-1.2,0.58,0);g.add(engCover);
  // Rear wing
  var rw=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,1.3),mat);
  rw.position.set(-2,0.9,0);g.add(rw);
  var drs=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.12,1.25),mat);
  drs.position.set(-1.95,1.18,0);g.add(drs);
  for(var ws=-1;ws<=1;ws+=2){
    var sup=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.45,0.06),dark);
    sup.position.set(-2,0.6,ws*0.5);g.add(sup);
  }
  // Front wing with endplates
  var fw=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.12,1.4),mat);
  fw.position.set(2.9,0.22,0);g.add(fw);
  for(var fe=-1;fe<=1;fe+=2){
    var fep=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.16,0.04),mat);
    fep.position.set(2.88,0.22,fe*0.72);g.add(fep);
  }
  // Floor plate
  var floor=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.03,1.15),carbon);
  floor.position.set(0,0.22,0);g.add(floor);
  // Wheels
  var wG=new THREE.CylinderGeometry(0.28,0.28,0.18,10);
  var wM=new THREE.MeshPhongMaterial({color:0x111111});
  [[1.3,0.28,0.65],[1.3,0.28,-0.65],[-1.3,0.28,0.65],[-1.3,0.28,-0.65]].forEach(function(p){
    var w=new THREE.Mesh(wG,wM);w.rotation.x=Math.PI/2;w.position.set(p[0],p[1],p[2]);g.add(w);
    var hub=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.2,8),mat);
    hub.rotation.x=Math.PI/2;hub.position.set(p[0],p[1],p[2]);g.add(hub);
  });
  // Underglow (bright for night race)
  var glMesh=new THREE.Mesh(new THREE.PlaneGeometry(3.5,1),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.7}));
  glMesh.rotation.x=-Math.PI/2;glMesh.position.y=0.05;g.add(glMesh);
  // Tail light
  var tl=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.6),new THREE.MeshBasicMaterial({color:0xff0000}));

function makeLabel(text,bgColor){
  var c=document.createElement('canvas');c.width=256;c.height=64;
  var ctx=c.getContext('2d');
  ctx.fillStyle=bgColor;ctx.fillRect(4,4,248,56);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text.substring(0,14),128,34);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.scale.set(3.5,0.9,1);return sp;
}

/* ============ CAMERA (GTA CINEMATIC) ============ */
function startCameraSystem(){
  switchCam('wide');
  camTimer=setInterval(function(){
    if(phase!=='racing')return;
    var leader=getStandings()[0];
    var pct=leader?(leader.progress/(TOTAL_LAPS*100)*100):0;
    if(pct>88) switchCam(pick(['chase','lowdrama','dramatic','onboard']));
    else if(pct>65) switchCam(pick(['chase','lowdrama','onboard','dramatic','sweepCorner','trackside','orbit']));
    else if(pct>30) switchCam(pick(['chase','helicopter','trackside','lowdrama','reverse','orbit','onboard','sweepCorner','topdown']));
    else switchCam(pick(['wide','chase','helicopter','trackside','lowdrama','reverse','orbit','onboard','topdown','dramatic','sweepCorner']));
  },2200);
}

function switchCam(mode){
  cameraMode=mode;
  var cam=qs('#hCam');
  var labels={wide:'WIDE',chase:'CHASE CAM',helicopter:'HELICOPTER',trackside:'TRACKSIDE',lowdrama:'CINEMATIC',reverse:'REVERSE CAM',orbit:'ORBIT',onboard:'ONBOARD',topdown:'TOP DOWN',dramatic:'TELEPHOTO',sweepCorner:'CORNER CAM'};
  if(cam)cam.innerHTML='<span class="h-rec"></span>'+(labels[mode]||mode);
  doFlash();
}

function updateCamera(time){
  var sorted=getStandings();if(!sorted.length)return;
  var leader=sorted[0];
  var lCar=carMeshes[leader.id];if(!lCar)return;
  var lt=Math.min((leader.progress%100)/100,0.9999);
  var lPos=circuit.getPointAt(lt);
  var lTan=circuit.getTangentAt(lt).normalize();
  var lRight=new V().crossVectors(lTan,new V(0,1,0)).normalize();

  // Pack center
  var cx=0,cz=0,cn=0;
  for(var i=0;i<Math.min(sorted.length,4);i++){
    var cm=carMeshes[sorted[i].id];
    if(cm){cx+=cm.position.x;cz+=cm.position.z;cn++}
  }
  if(cn){cx/=cn;cz/=cn}

  if(cameraMode==='wide'){
    camGoalPos.set(0,75,80);camGoalTarget.set(0,0,-5);camGoalFov=55;camLerp=0.02;
  }else if(cameraMode==='chase'){
    var behind=new V().copy(lPos).addScaledVector(lTan,-14).addScaledVector(lRight,2);
    behind.y=5;
    var ahead=new V().copy(lPos).addScaledVector(lTan,15);ahead.y=1;
    camGoalPos.copy(behind);camGoalTarget.copy(ahead);camGoalFov=68;camLerp=0.045;
  }else if(cameraMode==='helicopter'){
    camGoalPos.set(cx,55,cz+15);camGoalTarget.set(cx,0,cz);camGoalFov=50;camLerp=0.02;
  }else if(cameraMode==='trackside'){
    var sidePos=new V().copy(lPos).addScaledVector(lRight,TRACK_W/2+14);
    sidePos.y=3;
    var look=new V().copy(lPos).addScaledVector(lTan,5);look.y=1;
    camGoalPos.copy(sidePos);camGoalTarget.copy(look);camGoalFov=52;camLerp=0.035;
  }else if(cameraMode==='lowdrama'){
    var low=new V().copy(lPos).addScaledVector(lTan,-6).addScaledVector(lRight,5);
    low.y=1.2;
    var lookLow=new V().copy(lPos).addScaledVector(lTan,10);lookLow.y=1.5;
    camGoalPos.copy(low);camGoalTarget.copy(lookLow);camGoalFov=82;camLerp=0.03;
  }else if(cameraMode==='reverse'){
    var front=new V().copy(lPos).addScaledVector(lTan,16);front.y=4;
    var lookBack=new V().copy(lPos).addScaledVector(lTan,-10);lookBack.y=1;
    camGoalPos.copy(front);camGoalTarget.copy(lookBack);camGoalFov=60;camLerp=0.03;
  }else if(cameraMode==='orbit'){
    var angle=time*0.25;var radius=50;
    camGoalPos.set(cx+Math.cos(angle)*radius,20,cz+Math.sin(angle)*radius);
    camGoalTarget.set(cx,1,cz);camGoalFov=55;camLerp=0.022;
  }else if(cameraMode==='onboard'){
    var ob=new V().copy(lPos).addScaledVector(lTan,-5);ob.y=2;
    var obLook=new V().copy(lPos).addScaledVector(lTan,20);obLook.y=1;
    camGoalPos.copy(ob);camGoalTarget.copy(obLook);camGoalFov=78;camLerp=0.06;
  }else if(cameraMode==='topdown'){
    camGoalPos.set(lPos.x,40,lPos.z+3);
    camGoalTarget.set(lPos.x,0,lPos.z);camGoalFov=50;camLerp=0.03;
  }else if(cameraMode==='dramatic'){
    var dBack=new V().copy(lPos).addScaledVector(lTan,-35);dBack.y=2.5;
    var dLook=new V().copy(lPos).addScaledVector(lTan,5);dLook.y=1;
    camGoalPos.copy(dBack);camGoalTarget.copy(dLook);camGoalFov=20;camLerp=0.025;
  }else if(cameraMode==='sweepCorner'){
    var crnT=((Math.floor(lt*6)+1)/6)%1;
    var crnP=circuit.getPointAt(Math.max(0.0001,Math.min(crnT,0.9999)));
    var crnTan=circuit.getTangentAt(Math.max(0.0001,Math.min(crnT,0.9999)));
    var crnR=new V().crossVectors(crnTan,new V(0,1,0)).normalize();
    var crnPos=new V().copy(crnP).addScaledVector(crnR,TRACK_W/2+10);crnPos.y=3;
    camGoalPos.copy(crnPos);camGoalTarget.copy(lPos);camGoalTarget.y=1;camGoalFov=56;camLerp=0.03;
  }

  camPos.lerp(camGoalPos,camLerp);
  camTarget.lerp(camGoalTarget,camTLerp);
  currentFov+=(camGoalFov-currentFov)*0.02;
  camera.position.copy(camPos);camera.lookAt(camTarget);
  camera.fov=currentFov;camera.updateProjectionMatrix();
}

/* ============ RECORDING (composite canvas with UI) ============ */
function startRecording(){
  recordedChunks=[];
  if(typeof MediaRecorder==='undefined')return;
  var src=renderer.domElement;
  var maxW=1280,maxH=720;
  var aspect=src.width/src.height;
  var rw,rh;
  if(aspect>maxW/maxH){rw=maxW;rh=Math.round(maxW/aspect)}
  else{rh=maxH;rw=Math.round(maxH*aspect)}
  recCanvas=document.createElement('canvas');recCanvas.width=rw;recCanvas.height=rh;
  recCtx=recCanvas.getContext('2d');
  var stream=recCanvas.captureStream(30);
  var mimeType='';
  var types=['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported(types[i])){mimeType=types[i];break}}
  if(!mimeType){recCanvas=null;recCtx=null;return}
  mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:3000000});
  mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)recordedChunks.push(e.data)};
  mediaRecorder.start(200);
  qs('#recDot').style.display='flex';
}

function stopRecording(){
  if(!mediaRecorder||mediaRecorder.state==='inactive'){qs('#recDot').style.display='none';recCanvas=null;recCtx=null;return}
  mediaRecorder.onstop=function(){
    if(recordedChunks.length===0){qs('#recDot').style.display='none';recCanvas=null;recCtx=null;return}
    var mime=mediaRecorder.mimeType||'video/webm';
    var ext=mime.indexOf('mp4')!==-1?'mp4':'webm';
    var blob=new Blob(recordedChunks,{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;
    var d=new Date();var ts=d.getFullYear()+''+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+(d.getDate()<10?'0':'')+d.getDate()+'_'+(d.getHours()<10?'0':'')+d.getHours()+(d.getMinutes()<10?'0':'')+d.getMinutes();
    a.download='racing_roulette_'+ts+'.'+ext;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},200);
    qs('#recDot').style.display='none';
    mediaRecorder=null;recordedChunks=[];recCanvas=null;recCtx=null;
  };
  mediaRecorder.stop();
}

function updateRecCanvas(){
  if(!recCtx||!mediaRecorder||mediaRecorder.state==='inactive')return;
  recCtx.drawImage(renderer.domElement,0,0,recCanvas.width,recCanvas.height);
  drawRecUI(recCtx,recCanvas.width,recCanvas.height);
}

function drawRecUI(ctx,w,h){
  if(phase!=='racing'&&phase!=='result')return;
  var sorted=getStandings();if(!sorted.length)return;
  var s=w/1280;
  // Standings panel
  var px=10*s,py=10*s,pw=155*s;
  var rh2=19*s,hh=22*s;
  var ph=hh+sorted.length*rh2+6*s;
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(px,py,pw,ph);
  ctx.fillStyle='#555';ctx.font='bold '+Math.round(8*s)+'px sans-serif';ctx.textAlign='left';
  ctx.fillText('STANDINGS',px+8*s,py+15*s);
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];var y=py+hh+i*rh2;
    ctx.fillStyle=i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#666';
    ctx.font='bold '+Math.round(10*s)+'px sans-serif';
    ctx.fillText('P'+(i+1),px+8*s,y+13*s);
    ctx.fillStyle=r.color;ctx.beginPath();ctx.arc(px+38*s,y+10*s,3.5*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=Math.round(10*s)+'px sans-serif';
    ctx.fillText(r.name.substring(0,12),px+46*s,y+13*s);
  }
  // Lap display
  var leaderLap=Math.min(Math.floor(sorted[0].progress/100)+1,TOTAL_LAPS);
  var lapText='LAP '+leaderLap+' / '+TOTAL_LAPS;
  ctx.font='bold '+Math.round(11*s)+'px sans-serif';ctx.textAlign='center';
  var tw=ctx.measureText(lapText).width;
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(w/2-tw/2-8*s,py,tw+16*s,22*s);
  ctx.fillStyle='#fff';ctx.fillText(lapText,w/2,py+15*s);
  // Camera mode
  var camLabels={wide:'WIDE',chase:'CHASE',helicopter:'HELI',trackside:'TRACK',lowdrama:'CINE',reverse:'REVERSE',orbit:'ORBIT',onboard:'ONBOARD',topdown:'TOP',dramatic:'TELE',sweepCorner:'CORNER'};
  var camText=camLabels[cameraMode]||cameraMode;
  ctx.font='bold '+Math.round(9*s)+'px sans-serif';ctx.textAlign='right';
  var ctw=ctx.measureText(camText).width;
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(w-ctw-26*s,py,ctw+20*s,20*s);
  ctx.fillStyle='#e10600';ctx.fillText(camText,w-16*s,py+14*s);
  ctx.textAlign='left';
  // Progress bar
  var pct=sorted[0].progress/(TOTAL_LAPS*100);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(0,h-3*s,w,3*s);
  var grad=ctx.createLinearGradient(0,0,w*pct,0);
  grad.addColorStop(0,'#e10600');grad.addColorStop(1,'#ffcc00');
  ctx.fillStyle=grad;ctx.fillRect(0,h-3*s,w*pct,3*s);
}

function doFlash(){var f=qs('#flash');f.style.opacity='0.18';f.style.transition='opacity 0s';setTimeout(function(){f.style.transition='opacity .2s';f.style.opacity='0'},50)}
function showComment(t){var c=qs('#commentary');c.textContent=t;c.className='';void c.offsetWidth;c.className='show'}

/* ============ RACE LOGIC ============ */
function getStandings(){
  return racers.slice().sort(function(a,b){
    if(a.finished&&b.finished)return a.finishOrder-b.finishOrder;
    if(a.finished)return-1;if(b.finished)return 1;
    return b.progress-a.progress;
  });
}

function startRaceLoop(){
  var lastTime=performance.now();
  var totalDist=TOTAL_LAPS*100;
  var lastLapAnnounce=0;
  function tick(now){
    if(phase!=='racing')return;
    var dt=Math.min(now-lastTime,50);lastTime=now;var time=now*0.001;
    var allDone=true;
    // Rubber-band racing: keep pack tight, frequent overtakes, decide winner late
    var maxProg=0,minProg=totalDist;
    for(var i=0;i<racers.length;i++){
      if(!racers[i].finished){
        if(racers[i].progress>maxProg)maxProg=racers[i].progress;
        if(racers[i].progress<minProg)minProg=racers[i].progress;
      }
    }
    var spread=maxProg-minProg;
    for(var i=0;i<racers.length;i++){
      var r=racers[i];if(r.finished)continue;allDone=false;
      var isW=r.id===winnerId;
      var pct=r.progress/totalDist*100;
      // Base speed with wave pattern (creates natural overtakes)
      var wave=Math.sin(now*0.002+i*1.7)*0.12+Math.sin(now*0.005+i*3.1)*0.08;
      var jitter=(Math.random()-0.5)*0.35;
      var accel=r.speed+jitter+wave;
      var boost=0;
      // Rubber-band: pull back leaders, push up stragglers (keeps pack tight)
      var relPos=(r.progress-minProg)/(spread+0.1);
      if(spread>6)boost+=(0.5-relPos)*0.15;
      // Phase-based winner advantage (very subtle until final moments)
      if(pct<60){
        // Early/mid race: everyone is equal, pure chaos
        boost+=(Math.random()-0.5)*0.12;
        if(isW)boost+=0.02; // tiny invisible edge
      }else if(pct<85){
        // Getting serious: winner starts to be slightly favored
        if(isW)boost+=0.06+Math.random()*0.04;
        else boost+=(Math.random()-0.5)*0.08;
      }else if(pct<94){
        // Final laps: winner pulls but others still competitive
        if(isW)boost+=0.12+(pct-85)*0.01;
        else boost+=(Math.random()-0.5)*0.06-0.02;
      }else{
        // Last stretch: winner decisively pulls ahead
        if(isW)boost+=0.25+(pct-94)*0.04;
        else boost+=-0.05-(Math.random()*0.04);
      }
      // Random surge events (any car can temporarily lead)
      if(Math.random()<0.003&&pct<90)boost+=(Math.random()>0.5?1:-1)*0.4;
      var delta=(accel+boost)*(dt/16);
      r.progress=Math.min(r.progress+Math.max(delta,0.03),totalDist);
      r.speed+=(Math.random()-0.5)*0.008;
      r.speed=Math.max(0.12,Math.min(0.35,r.speed));
      if(r.progress>=totalDist&&!r.finished){r.finished=true;finishCount++;r.finishOrder=finishCount}
    }
    // Stop recording after top 3 finish + 3s
    if(finishCount>=Math.min(3,racers.length)&&recordEnabled&&mediaRecorder&&!recordStopQueued){
      recordStopQueued=true;
      setTimeout(function(){stopRecording()},3000);
    }
    // Commentary
    var sorted=getStandings();
    if(sorted.length>0){
      var nl=sorted[0].id;
      var lPct=sorted[0].progress/totalDist*100;
      if(lastLeaderId&&nl!==lastLeaderId&&lPct>5&&lPct<95){
        overtakeCount++;
        if(overtakeCount%2===0)showComment(sorted[0].name.toUpperCase()+' '+pick(C_LD));
        else showComment(pick(C_OV));
      }
      lastLeaderId=nl;
      if(sorted.length>=2&&Math.abs(sorted[0].progress-sorted[1].progress)<5&&lPct>15&&lPct<90&&Math.random()<0.012)showComment(pick(C_CL));
      if(lPct>88&&lPct<90)showComment(pick(C_FN));
      // Lap announcements
      var leaderLap=Math.floor(sorted[0].progress/100)+1;
      if(leaderLap>lastLapAnnounce&&leaderLap<=TOTAL_LAPS){
        lastLapAnnounce=leaderLap;
        if(leaderLap===TOTAL_LAPS)showComment('FINAL LAP!');
        else if(leaderLap>1)showComment('LAP '+leaderLap);
      }
      // Update lap display
      var dispLap=Math.min(leaderLap,TOTAL_LAPS);
      qs('#lapDisp').textContent='LAP '+dispLap+' / '+TOTAL_LAPS;
    }
    // Update cars
    for(var ci=0;ci<racers.length;ci++){
      var rc=racers[ci];var mesh=carMeshes[rc.id];if(!mesh)continue;
      positionCarOnTrack(mesh,rc.progress);
      mesh.position.y=Math.sin(now*0.01+ci)*0.03;
    }
    updateCamera(time);updateHUD();
    renderer.render(scene,camera);
    updateRecCanvas();
    if(allDone){
      phase='result';clearInterval(camTimer);cameraMode='orbit';
      doFlash();showComment('CHECKERED FLAG!');
      setTimeout(showResult,2500);
      (function rr(t){updateCamera(t*0.001);renderer.render(scene,camera);updateRecCanvas();if(phase==='result')requestAnimationFrame(rr)})(now);
      return;
    }
    animId=requestAnimationFrame(tick);
  }
  animId=requestAnimationFrame(tick);
}

/* ============ HUD ============ */
function updateHUD(){
  var box=qs('#hBoard');if(!box)return;
  var sorted=getStandings();
  var h='<div class="h-bt">STANDINGS</div>';
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];var pc=i===0?'g':i===1?'s':i===2?'b':'';
    h+='<div class="h-row"><span class="h-p '+pc+'">P'+(i+1)+'</span><span class="h-d" style="background:'+r.color+'"></span><span class="h-n">'+esc(r.name)+'</span></div>';
  }
  box.innerHTML=h;
  var bar=qs('#progBar');if(bar&&sorted.length)bar.style.width=(sorted[0].progress/(TOTAL_LAPS*100)*100)+'%';
}

/* ============ UI SCREENS ============ */
function renderSetup(){
  var s=qs('#setupScreen');s.style.display='flex';
  s.innerHTML='<h1 class="s-title">Racing Roulette 3D</h1><p class="s-sub">Add options and watch them race on a full circuit!</p>';
  var form=document.createElement('form');form.className='s-form';
  form.innerHTML='<input type="text" id="mInp" placeholder="A, B, C, D (comma separated)" maxlength="200"/><button type="submit">Add</button>';
  form.onsubmit=function(e){
    e.preventDefault();var inp=qs('#mInp');var raw=inp.value.trim();
    if(!raw)return;
    var parts=raw.indexOf(',')!==-1?raw.split(','):[raw];
    for(var pi=0;pi<parts.length;pi++){
      var v=parts[pi].trim();
      if(!v||options.length>=20)continue;
      idCnt++;options.push({id:'o'+idCnt,name:v,color:COLORS[options.length%COLORS.length]});
    }
    renderSetup();setTimeout(function(){var i=qs('#mInp');if(i)i.focus()},10);
  };
  s.appendChild(form);
  var chips=document.createElement('div');chips.className='s-chips';
  for(var i=0;i<options.length;i++){
    (function(o,idx){
      var c=document.createElement('div');c.className='s-chip';
      c.innerHTML='<span class="s-dot" style="background:'+COLORS[idx%COLORS.length]+'"></span><span>'+esc(o.name)+'</span>';
      var x=document.createElement('button');x.className='s-x';x.innerHTML='&times;';
      x.onclick=function(){options=options.filter(function(z){return z.id!==o.id});for(var j=0;j<options.length;j++)options[j].color=COLORS[j%COLORS.length];renderSetup()};
      c.appendChild(x);chips.appendChild(c);
    })(options[i],i);
  }
  s.appendChild(chips);
  var recRow=document.createElement('div');recRow.className='s-rec';
  var recToggle=document.createElement('div');recToggle.className='s-toggle'+(recordEnabled?' on':'');
  recToggle.onclick=function(){recordEnabled=!recordEnabled;recToggle.className='s-toggle'+(recordEnabled?' on':'')};
  var recInfo=document.createElement('div');recInfo.className='s-rec-info';
  recInfo.innerHTML='<div class="s-rec-label">Record Race</div><div class="s-rec-sub">Auto-download video when race ends</div>';
  recRow.appendChild(recToggle);recRow.appendChild(recInfo);
  s.appendChild(recRow);
  var btn=document.createElement('button');btn.className='s-go';
  if(options.length<2){btn.disabled=true;btn.textContent='Add '+(2-options.length)+' more option'+(options.length===0?'s':'');}
  else btn.textContent='START RACE';
  btn.onclick=function(){if(options.length>=2)beginCountdown()};
  s.appendChild(btn);
}

function beginCountdown(){
  winnerId=options[Math.floor(Math.random()*options.length)].id;
  finishCount=0;lastLeaderId=null;overtakeCount=0;racers=[];
  for(var i=0;i<options.length;i++){var o=options[i];racers.push({id:o.id,name:o.name,color:o.color,progress:0,speed:0.15+Math.random()*0.12,finished:false,finishOrder:0})}
  qs('#setupScreen').style.display='none';
  buildScene();renderer.render(scene,camera);
  qs('#hud').style.display='block';qs('#progWrap').style.display='block';qs('#lapDisp').style.display='block';updateHUD();
  if(recordEnabled)startRecording();
  // Pre-race camera: aerial view of circuit
  camPos.set(0,90,60);camTarget.set(0,0,-10);
  camGoalPos.copy(camPos);camGoalTarget.copy(camTarget);
  camera.position.copy(camPos);camera.lookAt(camTarget);
  var cd=qs('#cdOverlay');cd.style.display='flex';var count=3;
  function ctick(){
    if(count>0){cd.innerHTML='<div class="cd-n">'+count+'</div>';count--;setTimeout(ctick,800)}
    else if(count===0){cd.innerHTML='<div class="cd-g">GO!</div>';count--;
      setTimeout(function(){cd.style.display='none';phase='racing';startRaceLoop();startCameraSystem()},500)}
  }
  (function pr(){renderer.render(scene,camera);updateRecCanvas();if(phase!=='racing')requestAnimationFrame(pr)})();
  ctick();
}

function showResult(){
  var standings=getStandings();var w=standings[0];
  // Strong flash
  var fl=qs('#flash');fl.style.transition='none';fl.style.opacity='0.5';
  setTimeout(function(){fl.style.transition='opacity .4s';fl.style.opacity='0'},100);
  showComment(w.name.toUpperCase()+' WINS!');
  // More confetti
  var cb=document.createElement('div');cb.className='confetti-box';
  for(var i=0;i<120;i++){var p=document.createElement('div');p.className='conf';var sz=6+Math.random()*12;
    p.style.cssText='left:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;background:'+CONF_C[i%CONF_C.length]+';border-radius:'+(Math.random()>0.5?'50%':'2px')+';animation-delay:'+Math.random()*3+'s;animation-duration:'+(2+Math.random()*3)+'s';
    cb.appendChild(p)}document.body.appendChild(cb);
  var medals=['\u{1F947}','\u{1F948}','\u{1F949}'];var pcls=['gd','sv','bz'];
  // Delayed card reveal for dramatic buildup
  setTimeout(function(){
    var ov=qs('#resultOverlay');ov.style.display='flex';
    var h='<div class="r-card"><div class="r-t">\u{1F3C6}</div><div class="r-l">AND THE WINNER IS</div><div class="r-w">'+esc(w.name)+'</div><div class="r-list"><div class="r-lt">Final Standings</div>';
    for(var i=0;i<standings.length;i++){var r=standings[i];
      h+='<div class="r-row"><span class="r-rp '+(pcls[i]||'')+'">'+(medals[i]||(i+1))+'</span><span class="r-rd" style="background:'+r.color+'"></span><span class="r-rn">'+esc(r.name)+'</span></div>'}
    h+='</div><button class="r-btn" id="resetBtn">Race Again</button></div>';
    ov.innerHTML=h;qs('#resetBtn').onclick=resetAll;
  },1200);
}

function resetAll(){
  cancelAnimationFrame(animId);clearInterval(camTimer);
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();mediaRecorder=null;recordedChunks=[]}
  qs('#recDot').style.display='none';
  phase='setup';racers=[];winnerId=null;finishCount=0;recordStopQueued=false;recCanvas=null;recCtx=null;
  qs('#hud').style.display='none';qs('#progWrap').style.display='none';qs('#lapDisp').style.display='none';
  qs('#resultOverlay').style.display='none';qs('#resultOverlay').innerHTML='';
  var cb=document.querySelector('.confetti-box');if(cb)cb.remove();
  renderSetup();
}

/* ============ INIT ============ */
initThree();renderSetup();
(function idle(){renderer.render(scene,camera);if(phase==='setup')requestAnimationFrame(idle)})();
</script>
